<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>almer@blog: ~</title>
<meta name="theme-color" content="#0B0C10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0C10;
  --win:#101219;
  --bar:#14161E;
  --rule:#242736;
  --text:#D7D5CE;
  --dim:#8A8C99;
  --faint:#5B5D6B;
  --violet:#BB9AF7;
  --green:#93C48D;
  --cyan:#7FB3B0;
  --warn:#E3A93F;
  --red:#F0666A;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --pad:clamp(16px,4vw,40px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--mono);font-size:15px;line-height:1.7;
  min-height:100vh;display:flex;flex-direction:column;
}
body::after{
  content:"";position:fixed;inset:0;z-index:999;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.02) 0 1px,transparent 1px 3px);
}
a{color:var(--violet)}
::selection{background:var(--violet);color:var(--bg)}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}

/* ============ title bar ============ */
.titlebar{
  position:sticky;top:0;z-index:60;
  background:var(--bar);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:14px;
  padding:0 var(--pad);height:52px;
}
.dots{display:flex;gap:7px;flex:none}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--rule);display:block}
.dots i:first-child{background:#33294F}
.tpath{
  flex:1;text-align:center;font-size:13px;color:var(--dim);
  background:none;border:0;font-family:var(--mono);cursor:pointer;padding:6px 4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tpath b{color:var(--green);font-weight:500}
.tpath:hover{color:var(--text)}
.tpath span{color:var(--cyan)}
.helpbtn{
  flex:none;background:none;border:1px solid var(--rule);color:var(--violet);
  font-family:var(--mono);font-size:12px;padding:6px 12px;cursor:pointer;
  transition:.16s ease;white-space:nowrap;
}
.helpbtn:hover{background:var(--violet);color:var(--bg);border-color:var(--violet)}

/* ============ output ============ */
main{flex:1;padding:26px var(--pad) 40px;max-width:960px;width:100%;margin:0 auto}
.block{margin-bottom:30px;scroll-margin-top:66px}
.cmdline{color:var(--dim);font-size:14px;margin:0 0 14px;word-break:break-word}
.cmdline b{color:var(--green);font-weight:500}
.cmdline span{color:var(--cyan)}
.cmdline em{color:var(--text);font-style:normal}

.note{color:var(--dim);font-size:13.5px;margin:0 0 16px;padding-left:14px;border-left:1px solid var(--rule)}
.err{color:var(--warn)}
.ok{color:var(--green)}

/* welcome */
.banner{
  color:var(--violet);font-size:clamp(6px,1.62vw,13px);line-height:1.3;
  white-space:pre;overflow-x:auto;margin:0 0 20px;font-weight:500;
}
.lede{max-width:70ch;margin:0 0 18px}
.lede b{color:var(--violet);font-weight:500}

/* ============ listings ============ */
.rows{border-top:1px solid var(--rule);margin:0 0 6px}
.row{
  display:grid;grid-template-columns:104px 82px 1fr 68px;gap:16px;align-items:baseline;
  width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);
  color:var(--text);font-family:var(--mono);font-size:14px;
  padding:13px 10px 13px 4px;cursor:pointer;transition:background .15s ease,padding .15s ease;
}
.row:hover,.row:focus-visible{background:var(--win);padding-left:12px}
.row .d{color:var(--faint);font-size:12.5px;white-space:nowrap}
.row .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;padding:2px 6px;justify-self:start;white-space:nowrap}
.k.writeup{color:var(--violet)} .k.project{color:var(--cyan)} .k.cert{color:var(--green)} .k.note{color:var(--cyan)}
.row .n{font-size:15px;line-height:1.4}
.row:hover .n{color:var(--violet)}
.row .r{color:var(--faint);font-size:12.5px;text-align:right;white-space:nowrap}
.row .x{grid-column:3/5;color:var(--dim);font-size:13px;line-height:1.55;margin:5px 0 0;max-width:64ch}

/* ============ prose (cat output) ============ */
.doc{max-width:76ch;font-size:15px;line-height:1.85}
.doc.wide{max-width:none}
.doc figure{margin:0 0 26px}
.job{margin:0 0 22px;padding-left:16px;border-left:1px solid var(--rule)}
.job-h{color:var(--text);font-size:14.5px}
.job-d{color:var(--faint);font-size:12.5px;margin:4px 0 8px}
.job p{margin:0;color:var(--dim);font-size:14.5px}
.doc img{display:block;width:100%;height:auto;border:1px solid var(--rule);background:var(--win)}
.doc figcaption{color:var(--faint);font-size:12.5px;margin-top:9px;line-height:1.5}
.doc a{color:var(--violet)}
.doc h3{scroll-margin-top:72px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin:0 0 6px}
.lcell{background:var(--bg);border:0;color:var(--violet);font-family:var(--mono);font-size:13.5px;text-align:left;padding:11px 13px;cursor:pointer;transition:background .15s ease,color .15s ease}
.lcell:hover,.lcell:focus-visible{background:var(--win);color:var(--text)}
.pn{display:flex;gap:10px;flex-wrap:wrap;margin:32px 0 0;padding-top:22px;border-top:1px solid var(--rule)}
.lvlnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 32px;padding:0 0 26px;border-bottom:1px solid var(--rule)}
.lvlnav button{background:none;border:1px solid var(--rule);color:var(--dim);font-family:var(--mono);font-size:12px;padding:5px 10px;cursor:pointer;transition:.15s ease}
.lvlnav button:hover{color:var(--violet);border-color:var(--violet)}
.embed{border:1px solid var(--rule);background:#fff;margin:0 0 22px;line-height:0}
.embed iframe{display:block;width:100%;height:600px;border:0}
.doc p{margin:0 0 20px}
.doc h3{
  font-size:15px;font-weight:600;color:var(--violet);margin:34px 0 12px;letter-spacing:.01em;
}
.doc h3::before{content:"## ";color:var(--faint);font-weight:400}
.doc ul{list-style:none;margin:0 0 20px;padding:0}
.doc li{margin-bottom:7px;padding-left:22px;position:relative}
.doc li::before{content:"-";position:absolute;left:6px;color:var(--violet)}
.doc blockquote{
  margin:0 0 22px;padding:2px 0 2px 18px;border-left:2px solid var(--violet);
  color:var(--dim);font-style:italic;
}
.doc pre{
  background:var(--win);border:1px solid var(--rule);border-left:2px solid var(--green);
  padding:16px 18px;overflow-x:auto;margin:0 0 22px;font-size:13px;line-height:1.65;color:#C8C5B9;
}
.doc code{color:var(--violet)}
.doc pre code{color:inherit}
.doc b{color:var(--text);font-weight:600}

.meta{
  display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--faint);font-size:12.5px;
  padding:0 0 18px;margin:0 0 26px;border-bottom:1px solid var(--rule);
}

/* ============ tables (help, certs) ============ */
.tbl{width:100%;border-collapse:collapse;margin:0 0 8px;font-size:14px}
.tbl td{padding:9px 14px 9px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl td:first-child{white-space:nowrap;width:1%}
.cmdchip{
  background:none;border:1px solid var(--rule);color:var(--violet);
  font-family:var(--mono);font-size:13px;padding:4px 10px;cursor:pointer;transition:.15s ease;
}
.cmdchip:hover{background:var(--violet);color:var(--bg);border-color:var(--violet)}
.tbl .desc{color:var(--dim)}
.st{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;padding:2px 7px;white-space:nowrap}
.st.held{color:var(--green)} .st.wip{color:var(--warn)} .st.queued{color:var(--faint)}

/* ============ prompt dock ============ */
.dock{
  position:sticky;bottom:0;z-index:60;
  background:var(--bar);border-top:1px solid var(--rule);
  padding:0 var(--pad) env(safe-area-inset-bottom);
}
.dock-inner{max-width:960px;margin:0 auto}
.railwrap{display:flex;align-items:center;gap:12px;padding:11px 0 0}
.raillabel{font-size:11px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;flex:none}
.rail{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}
.rail::-webkit-scrollbar{height:3px}
.rail::-webkit-scrollbar-thumb{background:var(--rule)}
.pill{
  flex:none;background:none;border:1px solid var(--rule);color:var(--text);
  font-family:var(--mono);text-align:left;padding:7px 12px;cursor:pointer;transition:.15s ease;
}
.pill:hover{border-color:var(--violet);background:var(--win)}
.pill b{display:block;font-size:12.5px;font-weight:500;color:var(--violet)}
.pill span{display:block;font-size:11px;color:var(--dim);margin-top:1px;white-space:nowrap}

.inputrow{display:flex;align-items:center;gap:10px;padding:12px 0 13px;position:relative}
.ps1{font-size:14px;color:var(--green);white-space:nowrap;flex:none}
.ps1 span{color:var(--cyan)}
.ps1 i{color:var(--dim);font-style:normal}
#cmd{
  flex:1;background:none;border:0;outline:0;color:var(--text);
  font-family:var(--mono);font-size:14px;padding:2px 0;min-width:0;
}
#cmd::placeholder{color:var(--faint)}
.cursor{width:8px;height:16px;background:var(--violet);flex:none;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.ac{
  position:absolute;bottom:calc(100% + 8px);left:0;right:0;
  background:var(--win);border:1px solid var(--rule);max-height:230px;overflow-y:auto;
}
.ac:empty{display:none}
.ac button{
  display:flex;gap:14px;align-items:baseline;width:100%;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--rule);color:var(--text);
  font-family:var(--mono);font-size:13px;padding:9px 13px;cursor:pointer;
}
.ac button:last-child{border-bottom:0}
.ac button:hover,.ac button.sel{background:var(--bar)}
.ac button b{color:var(--violet);font-weight:500;white-space:nowrap}
.ac button span{color:var(--dim);font-size:12px}

@media (max-width:700px){
  body{font-size:14px}
  .row{grid-template-columns:1fr auto;gap:6px 12px;padding-left:0}
  .row:hover{padding-left:0}
  .row .d{grid-row:1;grid-column:1}
  .row .r{grid-row:1;grid-column:2}
  .row .k{grid-row:2;grid-column:1/3}
  .row .n{grid-row:3;grid-column:1/3}
  .row .x{grid-row:4;grid-column:1/3}
  .raillabel{display:none}
  .tpath{text-align:left}
  .doc{font-size:14.5px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

<script>
/* ------------------------------------------------------------------ data */
const BANDIT = [
  {id:"0", label:"Bandit 0", cmd:"ssh bandit0@bandit.lab.overthewire.org -p 2220", body:`<pre><code>ssh bandit0@bandit.lab.overthewire.org -p 2220
Password: bandit0</code></pre>
<p>SSH is the secure shell</p>
<p>-p 2220 is the port that this lab is going to open on</p>
<p>This is the host</p>`},
  {id:"0-1", label:"Bandit 0-1", cmd:"ls", body:`<pre><code>ls</code></pre>
<p>ls shows the list of files in the directory</p>
<pre><code>readme</code></pre>
<p>After doing ls, it shows readme as one of the files</p>
<pre><code>cat readme</code></pre>
<p>cat allows you to read what’s inside the file</p>
<p>then the password: <code>ZjLjTmM6FvvyRnrb2rfNWOZOTa6ip5If</code></p>`},
  {id:"1-2", label:"Bandit 1-2", cmd:"ls", body:`<pre><code>ls</code></pre>
<p>After doing ls, a file shows as “-”</p>
<pre><code>- 
cat ./-</code></pre>
<p>Again, we use cat to open up the file</p>
<p>Then the password is given: <code>263JGJPfgU6LtdEvgfWU1XP5yac29mFx</code></p>`},
  {id:"2-3", label:"Bandit 2-3", cmd:"ls", body:`<pre><code>ls
--spaces in this filename--</code></pre>
<p>We use ls to show the files</p>
<p>file shows as “—spaces in this filename—’</p>
<pre><code>cat ./&#x27;--spaces in this filename--&#x27;</code></pre>
<p>Again, we use cat to open up the file, but this time we have to use quotation marks because of the filename, and if we don’t use quotation marks, it will think it’s different strings and cause an error</p>
<p>The password is: <code>MNk8KNH3Usiio41PRUEoDFPqfxLPlSmx</code></p>`},
  {id:"3-4", label:"Bandit 3-4", cmd:"ls", body:`<pre><code>ls 
inhere</code></pre>
<p>I used ls, and this time we got a directory instead of a file called “inhere.”</p>
<pre><code>cd inhere
ls inhere</code></pre>
<p>cd is change directory, so we wanted to get into the inhere directory</p>
<p>After we got in, we ls the directory to see if there were any files</p>
<p>But unfortunately, there were no files</p>
<pre><code>ls -a 
...Hiding-From-You
cat ./&#x27;...Hiding-From-You&#x27;</code></pre>
<p>So I used -a in the ls command because -a gives us the hidden files inside the directory</p>
<p>After using ls -a, we got a hidden file called “...Hiding-From-You”</p>
<p>Then I used cat to show what&#x27;s inside the file</p>
<p>And I got the password: <code>2WmrDFRmJIq3IPxneAaMGhap0pFhF3NJ</code></p>
<p><br/></p>`},
  {id:"4-5", label:"Bandit 4-5", cmd:"ls", body:`<pre><code>ls
inhere
cd inhere
ls
-file00  -file01  -file02  -file03  -file04  -file05  -file06  -file07  -file08  -file09
cat ./&#x27;-file07&#x27;</code></pre>
<p>I used ls, and I got the “inhere” directory, and then I used “cd inhere” to change my directory to “inhere”</p>
<p>Again, I used ls, then got a bunch of different files</p>
<p>So I used cat for each file until I reached “-file07”, then got the password: <code>4oQYVPkxZOOEOO5pTW81FB8j8lxXGUQw</code></p>`},
  {id:"5-6", label:"Bandit 5-6", cmd:"ls", body:`<pre><code>ls 
inhere
cd inhere
ls 
maybehere00  maybehere02  maybehere04  maybehere06  maybehere08  maybehere10  maybehere12  maybehere14  maybehere16  maybehere18
maybehere01  maybehere03  maybehere05  maybehere07  maybehere09  maybehere11  maybehere13  maybehere15  maybehere17  maybehere19
find -size 1033c
./maybehere07/.file2
cat ./maybehere07/.file2</code></pre>
<p>ls to see files/directory</p>
<p>cd to change directory to “inhere”</p>
<p>ls to see files in “inhere”</p>
<p>We got a bunch of different files, so we use find</p>
<p>find is used to find something within a file, like size, users, groups, etc</p>
<p>So we use find -size 1033c</p>
<p>1033 is the byte size that we are looking for, and c is just for byte size</p>
<p>It gives us the path to find the file with the correct size that we are looking for</p>
<p>So we use cat to open the path and give us the password: <code>HWasnPhtq9AVKe0dmk45nxy20cvUa6EG</code></p>`},
  {id:"6-7", label:"Bandit 6-7", cmd:"ls", body:`<pre><code>ls
ls -a
.  ..  .bash_logout  .bashrc  .profile
cd ..
ls
bandit0   bandit19      bandit28      bandit4    behemoth5  drifter2     formulaone3  leviathan1  manpage4  maze7    narnia8  utumno8   vortex18  vortex5
bandit1   bandit2       bandit28-git  bandit5    behemoth6  drifter3     formulaone5  leviathan2  manpage5  maze8    narnia9  vortex0   vortex19  vortex6
bandit10  bandit20      bandit29      bandit6    behemoth7  drifter4     formulaone6  leviathan3  manpage6  maze9    ubuntu   vortex1   vortex2   vortex7
bandit11  bandit21      bandit29-git  bandit7    behemoth8  drifter5     krypton1     leviathan4  manpage7  narnia0  utumno0  vortex10  vortex20  vortex8
bandit12  bandit22      bandit3       bandit8    drifter0   drifter6     krypton2     leviathan5  maze0     narnia1  utumno1  vortex11  vortex21  vortex9
bandit13  bandit23      bandit30      bandit9    drifter1   drifter7     krypton3     leviathan6  maze1     narnia2  utumno2  vortex12  vortex22
bandit14  bandit24      bandit30-git  behemoth0  drifter10  drifter8     krypton4     leviathan7  maze2     narnia3  utumno3  vortex13  vortex23
bandit15  bandit25      bandit31      behemoth1  drifter12  drifter9     krypton5     manpage0    maze3     narnia4  utumno4  vortex14  vortex24
bandit16  bandit26      bandit31-git  behemoth2  drifter13  formulaone0  krypton6     manpage1    maze4     narnia5  utumno5  vortex15  vortex25
bandit17  bandit27      bandit32      behemoth3  drifter14  formulaone1  krypton7     manpage2    maze5     narnia6  utumno6  vortex16  vortex3
bandit18  bandit27-git  bandit33      behemoth4  drifter15  formulaone2  leviathan0   manpage3    maze6     narnia7  utumno7  vortex17  vortex4
cd ../
ls
oth           boot     etc         krypton  lib64              lost+found  media   opt   run                 snap  tmp     var
bin                dev      formulaone  lib      lib.usr-is-merged  manpage     mnt     proc  sbin                srv   usr     vortex
bin.usr-is-merged  drifter  home        lib32    libx32             maze        narnia  root  sbin.usr-is-merged  sys   utumno
find -type f -user bandit7 -group bandit6 -size 33c
./var/lib/dpkg/info/bandit7.password
cat ./var/lib/dpkg/info/bandit7.password</code></pre>
<p>ls showed no files or directories, so I used ls -a and it showed “. .. .bash_logout .bashrc .profile” for hidden directories and files</p>
<p>So cd “..” and the directory was home, so ls to check the files, and there were a bunch of files, but we were looking for the entire server</p>
<p>So I have to cd ../ again to get to the root of the server, then I ls the directory, and I got a bunch of different directories</p>
<p>But we were looking for a specific file that contains a user of bandit7, group bandit6, byte size 33</p>
<p>-type f is looking for files only</p>
<p>then we do find -type f -user bandit7 -group bandit6 -size 33c</p>
<p>This gives us a bunch of files that have permissions denied, but one that gives us access</p>
<p>which is ./var/lib/dpkg/info/bandit7.password all you do now is cat the file</p>
<p>this gives us the password: <code>morbNTDkSW6jIlUc0ymOdMaLnOlFVAaj</code><br/><br/></p>`},
  {id:"7-8", label:"Bandit 7-8", cmd:"ls", body:`<pre><code>ls 
data.txt
cat data.txt</code></pre>
<p>I ls to see what files or directories there are. The only one that was given was “data.txt” and we’re supposed to look in that file either way</p>
<p>After “ cat data.txt” it gives us a bunch of different usernames and passwords, but were specifically looking for “millionth”</p>
<pre><code>grep data.txt -e millionth</code></pre>
<p>grep is used when you&#x27;re looking for a pattern</p>
<p>-e is patterns are matching</p>
<p>after telling what file to look in and what word to look for</p>
<p>It gave me the password: <code>dfwvzFQi4mU0wfNbFOe9RoWskMLg7eEc</code></p>`},
  {id:"8-9", label:"Bandit 8-9", cmd:"ls", body:`<pre><code>ls 
data.txt
cat data.txt</code></pre>
<p>So I ls to see what files or directories it would give me, and the only one that showed up was data.txt</p>
<p>So I decided to see what’s inside the file, so I cat it, and it gave me a list of passwords, but we’re looking for passwords that occur once</p>
<p>I learned about sorting; it’s where you have a list, and you want to sort it in order</p>
<p>Piping is where you want to use multiple commands together, so you use “|” between the commands</p>
<p>Redirection is where you could send output to a file using “&lt;” or you could add something to the file by “&lt;&lt;” and you could also get input from a file using “&gt;”</p>
<pre><code>cat data.txt | grep 1 | sort</code></pre>
<p>In this level, we want to sort and cat, and I used grep to find a pattern</p>
<p>After this, the list looks so much cleaner, and I was able to go down the list and see which password was given once</p>

  {id:"11-12", label:"Bandit 11-12", cmd:"ls", body:`<pre><code>ls
data.txt
cat data.txt
Gur cnffjbeq vf 7k16JArUVv5LxVuJfsSVdbbtaHGlw9D4</code></pre>
<p>We ls the directory and saw we have a data.txt file, then we cat the file to see what&#x27;s inside the file, and we are given random letters and numbers</p>
<p>We are supposed to rotate the positions of these random letters and numbers 13 times</p>
<p>So we need to learn about ROT13</p>
<p>ROT13 is the alphabetical order, but it&#x27;s rotated 13 times already, so the input and output would look something like this:</p>
<p>input: ABCDEFGHIJKLM NOPQRSTUVWXYZ abcdefghijklm nopqrstuvwxyz</p>
<p>output: NOPQRSTUVWXYZ ABCDEFGHIJKLM nopqrstuvwxyz abcdefghijklm</p>
<p>Then the A lines up with the N, and the Z lines up with the M</p>
<pre><code>cat data.txt | tr &#x27;A-Za-z&#x27; &#x27;N-ZA-Mn-za-m&#x27;
The password is 7x16WNeHIi5YkIhWsfFIqoognUTyj9Q4</code></pre>
<p>So we’ve used piping where we combined two commands using “|”</p>
<p>tr is a way to translate or squeeze, or delete characters in the input and write in the output</p>
<p>So the ‘A-Za-z’ is just saying all the uppercase and lowercase letters, and ‘N-ZA-Mn-za-m’ is because N-Z is the second rotation of letters when it&#x27;s rotated by 13 times, and A-M is the first rotation of letters when it&#x27;s rotated</p>
<p>After that, we are given the password: <code>7x16WNeHIi5YkIhWsfFIqoognUTyj9Q4</code></p>`},

  {id:"13-14", label:"Bandit 13-14", cmd:"ls", body:`<pre><code>ls 
sshkey.private
cat sshkey.private
[RSA private key omitted — you get your own copy when you run this level]
exit</code></pre>
<p>First off, I ls the directory, and then I cat the file to see what was inside of it. What was inside was the string for the sshkey.private. I tried ssh into bandit14, but I kept getting my permissions denied.</p>
<p>How I kept getting denied was by doing this;</p>
<pre><code>ssh bandit14@bandit.labs.overthewire.org -p 2220 -i sshkey.private
!!! You are trying to log into this SSH server with a password on port 2220 from localhost.
!!! Connecting from localhost is blocked to conserve resources.
!!! Please log out and log in again.</code></pre>
<p>So this was completely wrong</p>
<pre><code>almer@LAPTOP-OHBL0RFG:~$ echo &#x27;[RSA private key omitted — you get your own copy when you run this level]&#x27; &gt; private.key</code></pre>
<p>When I exited from bandit13@bandit and went into almer@LAPTOP-OHBL0RFG, I echoed the sshkey.private key and redirected it into a new file on my host.</p>
<pre><code>almer@LAPTOP-OHBL0RFG:~$ ls 
private.key</code></pre>
<p>After this, I tried ssh into bandit14 as I did before, and it still didn’t work and kept getting denied</p>
<p>So I looked into the file permissions and saw it was -rw-r--r--, which r means read and w means write. With these permissions, I wasn’t able to execute as the owner.</p>
<pre><code>almer@LAPTOP-OHBL0RFG:~$ chmod 700 private.key</code></pre>
<p>chmod allows us to change the permissions of the file (private.key). 700 means to change a certain section&#x27;s permission. The 7 means the owner section, and it also means to allow them to read, write, and execute. Neither of the 0’s doesn’t allow group and others to read, write, and execute.</p>
<pre><code>almer@LAPTOP-OHBL0RFG:~$ ssh bandit14@bandit.labs.overthewire.org -p 2220 -i private.key</code></pre>
<p>since I was able to change the permissions of the file. I decided to ssh bandit14 another time. -i means identifying which private key file to use when trying to connect to a host or server. But after I typed this command, I was able to get into bandit14 labs without a password.</p>`},

<p>After trying -ign_eof in the command, -ign_eof tells OpenSSL to ignore the end of files, but to keep the TLS connection. But after putting in the current level’s password, I was able to get the private key, and then I remembered what to do from level 14</p>

<p>So after getting the private I exited from the bandit host, and I echoed the private key and redirected it into a new file.</p>
<pre><code>almer@LAPTOP-OHBL0RFG:~$ chmod 700 private.key
almer@LAPTOP-OHBL0RFG:~$ ssh bandit17@bandit.labs.overthewire.org -p 2220 -i private.key</code></pre>
<p>Then ssh into the next bandit level by -i, which identifies the private key, and I was able to get in.</p>`},

<p>So I ls to see what files were in the directory and then I decided to see what’s inside the files. There was a list of passwords in those files.</p>
<pre><code>diff passwords.new passwords.old 
42c42
&lt; x2gLTTjFwMOhQ8oWNbMN362QKxfRqGlO

&gt; BMIOFKM7CRSLI97voLp3TD80NAq5exxk</code></pre>
<p>diff is used to show what’s different between those two files, and it shows that the top passwords were different in the <a href="http://passwords.new" target="_blank" rel="noopener">passwords.new</a> file. While at the bottom, passwords show what was different in the passwords.old file. So our password is <code>x2gLTTjFwMOhQ8oWNbMN362QKxfRqGlO</code> since it says the next level’s password is in the passwords.new file</p>`},
  {id:"18-19", label:"Bandit 18-19", cmd:"ssh bandit18@bandit.labs.overthewire.org -p 2220", body:`<pre><code>ssh bandit18@bandit.labs.overthewire.org -p 2220
Welcome to OverTheWire!

If you find any problems, please report them to the #wargames channel on
discord or IRC.

--[ Playing the games ]--

  This machine might hold several wargames.
  If you are playing &quot;somegame&quot;, then:

    * PASSWORDS for each level are stored in /etc/somegame_pass/.

  Write-access to homedirectories is disabled. It is advised to create a
  working directory with a hard-to-guess name in /tmp/.  You can use the
  command &quot;mktemp -d&quot; in order to generate a random and hard to guess
  directory in /tmp/.  Read-access to both /tmp/ is disabled and to /proc
  restricted so that users cannot snoop on eachother. Files and directories
  with easily guessable or short names will be periodically deleted! The /tmp
  directory is regularly wiped.
  Please play nice:

    * don&#x27;t leave orphan processes running

    * don&#x27;t post passwords or spoilers

--[ Tips ]--

<p>Once I tried to ssh into Bandit level 18, and once I tried putting in the password, it said Connection closed. But the next level password is stored in a file called readme, and the reason we’re getting kicked out is because .bashrc was modified to log us out.</p>
<pre><code>ssh bandit18@bandit.labs.overthewire.org -p 2220 cat readme</code></pre>
<p>So we did it like this because with SSH, you could end ssh with another command. If the command is specified, then it will be done on the remote host instead of logging into the shell. Then we have to use cat to see what’s inside the readme file:</p>
<p>after entering the bandit18 level password. It gave me bandit 19’s level password: <code>cGWpMaKXVwDUNgPAVJbWYuGHVn9zl3j8</code></p>`},
  {id:"19-20", label:"Bandit 19-20", cmd:"ls", body:`<pre><code>ls
bandit20-do
file bandit20-do
bandit20-do: setuid ELF 32-bit LSB executable, Intel 80386, version 1 (SYSV), dynamically linked, interpreter /lib/ld-linux.so.2, BuildID[sha1]=38f1351d0068ccbbace0e437f34859de85e63025, for GNU/Linux 3.2.0, not stripped</code></pre>
<p>I decided to ls the directory to see what files or directories we have. The only one that shows up is bandit20-do. I wanted to see what type of file bandit20-do is, and it is a setuid fil,e which means set user id. Setuid is basically a file permission that lets users use the root permissions instead of the user executing only within that file</p>
<pre><code>./bandit20-do whoami
bandit20</code></pre>
<p>Then ./ is the current directory, and we wanted to see the owner of the bandit20-do file, so that’s why we use whoami. We see that the owner is bandit20</p>
<pre><code>./bandit20-do cat /etc/bandit_pass/bandit20</code></pre>
<p>So we go from the current directory to the bandit20-do file because the owner is bandit20, and we need the owner to get access into the bandit20 file. Then I cat into the pathway to get the password for bandit level 20, which is why I did /etc/bandit_pass/bandit20. Since we were the owners of bandit20, we were allowed in the bandit20 file.</p>
<p>So the password was: <code>0qXahG8ZjOVMN9Ghs7iOWsCfZyXOUbYO</code></p>`},
  {id:"20-21", label:"Bandit 20-21", cmd:"ls", body:`<pre><code>ls 
suconnect
./suconnect (port number)</code></pre>
<p>So we have a file called suconnect and with suconnect you have to add any port number at the end. Then we need a second terminal for the port number to connect to and listen to as well.</p>
<pre><code>nc -lvp 10000
Listening on 0.0.0.0 10000
Connection received on localhost 41108</code></pre>
<p>I decided to the netcat because it allows two terminals talk to each other over ports. -l means listen, -v means to get some more information, -p means to go to the port we’re trying to listen to. You could choose any port number so I wanted to choose 10000</p>
<p>Then we see on the second terminal that were listening to the port 10000 and that the first terminal received our connection on local on port 41108</p>
<pre><code>Listening on 0.0.0.0 9999
Connection received on localhost 41108
0qXahG8ZjOVMN9Ghs7iOWsCfZyXOUbYO
EeoULMCra2q0dSkYj561DX7s1CpBuOBt</code></pre>
<p>After putting in the current level’s password in the second terminal we recieve the next level’s password</p>
<pre><code>Read: 0qXahG8ZjOVMN9Ghs7iOWsCfZyXOUbYO
Password matches, sending next password</code></pre>
<p>In our first terminal we saw that read our password from the second terminal showing that it actually connected. It also say that the password matches so that means our password is correct. Then we were able to get the next password for the next level: <code>EeoULMCra2q0dSkYj561DX7s1CpBuOBt</code></p>`},
  {id:"21-22", label:"Bandit 21-22", cmd:"cd /etc/cron.d", body:`<pre><code>cd /etc/cron.d
ls
behemoth4_cleanup  cronjob_bandit22  cronjob_bandit24  leviathan5_cleanup    otw-tmp-dir
clean_tmp          cronjob_bandit23  e2scrub_all       manpage3_resetpw_job  sysstat</code></pre>
<p>In this level, we have to learn about cron. Cron is basically a schedule task like let’s say I want to schedule a certain task at a certain tim,e that’s when I would use cron.</p>
<p>I had to change the directory because it told me that I had to look for the configuration inside it</p>
<p>After I cd the directory the ls to see what’s inside, we have a bunch of different files and directory.</p>
<pre><code>cat cronjob_bandit22
@reboot bandit22 /usr/bin/cronjob_bandit22.sh &amp;&gt; /dev/null
* * * * * bandit22 /usr/bin/cronjob_bandit22.sh &amp;&gt; /dev/null</code></pre>
<p>Once I cat cronjob_bandit22, it shows that at reboot, the root user bandit22 is running /usr/bin/cronjob_bandit22.sh, and the output it is giving is /dev/null.</p>
<p>The ***** represents the cron scheduling, like the minute, hour, day, month, and day of week</p>
<pre><code>cat  /usr/bin/cronjob_bandit22.sh
#!/bin/bash
chmod 644 /tmp/t7O6lds9S0RqQh9aMcz6ShpAoZKF7fgv
cat /etc/bandit_pass/bandit22 &gt; /tmp/t7O6lds9S0RqQh9aMcz6ShpAoZKF7fgv</code></pre>
<p>So I wanted to see what bandit22 was running, so I decided to cat the pathway it was running. What I saw is that it’s using bash with a chmod 644, which means owners read and write, users read, group read in a pathway of /tmp/<code>t7O6lds9S0RqQh9aMcz6ShpAoZKF7fgv</code></p>
<p>Then we also see that the /etc/bandit_pass/bandit2 is being redirected to /tmp/<code>t7O6lds9S0RqQh9aMcz6ShpAoZKF7fgv</code>, and normally the password is usually held in /etc/bandit_pass/bandit22</p>
<pre><code>cat  /tmp/t7O6lds9S0RqQh9aMcz6ShpAoZKF7fgv
tRae0UfB9v0UzbCdn9cY0gQnds9GF58Q</code></pre>
<p>After cat to see what&#x27;s inside that file, I was able to get next level’s password: <code>tRae0UfB9v0UzbCdn9cY0gQnds9GF58Q</code></p>`},
  {id:"22-23", label:"Bandit 22-23", cmd:"cd /etc/cron.d", body:`<pre><code>cd /etc/cron.d

  { slug:"honeypot", title:"Building a T-Pot honeypot on DigitalOcean", kind:"project",
    date:"2026-01-21", read:"14 min", tags:["honeypot","t-pot","cloud","blue team"],
    excerpt:"A deliberately vulnerable server left open to the internet for two hours, and what the logs showed: mostly Europe and the US East Coast, mostly root with no password, mostly port 22.",
    body:`
<p>A honeypot is a fake vulnerable network to trick attackers, so we are able to analyze their behavior, including how they attack and where they attack. The reason I wanted to build a honeypot is to deepen my skills and learn how attackers behave, as well as where most attackers originate from.</p>

<h3>What I used</h3>
<ul>
  <li><b>VirtualBox</b> — 4096 MB memory, 4 CPU, Kali ISO</li>
  <li><b>DigitalOcean</b> — Ubuntu 24.04 LTS x64, basic CPU, 8 GB memory, 4 CPU</li>
  <li><b>T-Pot</b> — the Telekom Security repository</li>
</ul>

<h3>Creating the droplet</h3>
<figure><img src="https://github.com/user-attachments/assets/88e4285e-6ce6-4e11-b49c-38402c73090c" alt="Choosing the San Francisco region in DigitalOcean" loading="lazy"><figcaption>Choosing the San Francisco region in DigitalOcean</figcaption></figure>
<p>I decided to use DigitalOcean as my cloud provider because I wanted to do something a little different, since everyone does an AWS EC2 honeypot. In DigitalOcean, I created a droplet, then I chose San Francisco because I wanted to see how many attackers attack in my region.</p>
<figure><img src="https://github.com/user-attachments/assets/c7d152c7-cc0d-4a75-bae7-44d071a0186d" alt="Selecting the Ubuntu 24.04 LTS image" loading="lazy"><figcaption>Selecting the Ubuntu 24.04 LTS image</figcaption></figure>
<p>The next step is choosing the image for the honeypot. I decided to go with Ubuntu 24.04 LTS x64 because I've seen that it is compatible with T-Pot, and I was already comfortable with Ubuntu. T-Pot will be important because we need it for our dashboard to analyze the attackers' behavior and location.</p>
<p>After deciding on the image, we have to choose the size — and for the honeypot, it takes up a lot of space. The minimum needed memory is 8 GB. Hence the reason I chose 8 GB and 4 CPUs. The CPU options don't matter; any option would work.</p>
<figure><img src="https://github.com/user-attachments/assets/dd000826-06f7-4e23-a1f0-9efda6749330" alt="Picking password authentication over SSH keys" loading="lazy"><figcaption>Picking password authentication over SSH keys</figcaption></figure>
<p>Next, I had to choose an authentication method. I decided to go with the password method because I've already done the SSH key method, and the password method is faster. With SSH keys you would have to download the key to your file and then <code>chmod</code> it so that it is only readable. Once I finished choosing the password method, I was ready to create the droplet.</p>
<figure><img src="https://github.com/user-attachments/assets/b2a2328c-2b6c-4b40-8d6a-f07b7c1830ae" alt="The droplet once it finished provisioning" loading="lazy"><figcaption>The droplet once it finished provisioning</figcaption></figure>
<p>This is what it looks like after I created my droplet. We are given the IPv4, which is the public IP. This will be important because we will need to SSH into this address, and this is where we will be accessing T-Pot later on. We are also given the private IP for the cloud that is being used.</p>

<h3>Connecting and installing T-Pot</h3>
<figure><img src="https://github.com/user-attachments/assets/9aaf1184-f865-4599-b010-a0b4e98b5b9a" alt="SSH'd into the droplet as root" loading="lazy"><figcaption>SSH'd into the droplet as root</figcaption></figure>
<p>Inside VirtualBox, I went to the terminal, and before I even started I ran <code>ip a</code> to make sure my <code>eth0</code> reaches the network and shows an IP address like <code>10.XX.XX.XX</code>. Sometimes I wouldn't be able to reach the network, so I would have to disconnect the wired connection, reconnect it, then test <code>ip a</code> again. Eventually I would see an IP address under <code>eth0</code>. I SSH into <code>root@IP-Address</code> to remote into the server. I successfully got into the server — you can see <code>root@HoneyPot</code> at the bottom.</p>
<figure><img src="https://github.com/user-attachments/assets/dac8888a-266d-41fc-b316-074207c950ca" alt="Adding a non-root user and cloning the T-Pot repository" loading="lazy"><figcaption>Adding a non-root user and cloning the T-Pot repository</figcaption></figure>
<p>Before adding the user, I ran:</p>
<pre><code>apt-get update &amp;&amp; apt-get upgrade -y</code></pre>
<p>This will update the server and upgrade any tools or repositories.</p>
<p>The reason I decided to add a user is that I need a non-root user to run the honeypot on. Running the honeypot as root can lead to compromised information. Then I had to set the password for <code>almer</code>. The password will be very important later on. The other values don't matter — you can leave them blank, because the honeypot doesn't use them.</p>
<p><code>almer</code> has the least privileges, which is why I ran:</p>
<pre><code>sudo usermod -aG sudo almer
su almer
cd /home/almer
sudo apt install git
git clone https://github.com/telekom-security/tpotce
cd tpotce
./install.sh</code></pre>
<p><code>usermod -aG sudo</code> gives almer sudo privileges, which is like root or admin privileges. Then I switched user with <code>su almer</code>, which is why you see <code>almer@HoneyPot</code>. I moved to the home directory, made sure git was installed because the next command needs it, then cloned the T-Pot repository. When it finished cloning I changed into <code>tpotce</code>, where there are several directories and files — but the only one we need is <code>install.sh</code>.</p>
<p>During the middle of the installation, it will show that the SSH port is now <code>64295</code>. It will also ask what installation type you want. I chose <b>h</b>, which is hive, because it is the standard T-Pot. The others are S (sensor), L (LLM), I (mini), M (mobile) and T (tarpit). Near the end, it asks you to set a web username and password, which will be important later as well.</p>
<figure><img src="https://github.com/user-attachments/assets/79abe2f7-785c-44ac-8b9b-9c79ae82a2b3" alt="Active connections at the end of the install, showing port 64295" loading="lazy"><figcaption>Active connections at the end of the install, showing port 64295</figcaption></figure>
<p>At the end of the installation, it shows us the active internet connections. I see that 64295 is active, which is the new port to SSH into. Then it asks us to reboot. Once we reboot, it kicks us back to our machine.</p>
<figure><img src="https://github.com/user-attachments/assets/e001f1b1-3dab-4ebe-8f2f-0afcc2750251" alt="Reconnecting on the new SSH port" loading="lazy"><figcaption>Reconnecting on the new SSH port</figcaption></figure>
<p>I have to SSH into the new port because the old port (22) doesn't work anymore:</p>
<pre><code>ssh -p 64295 root@IP-Address</code></pre>
<p>I was able to connect to the root server. <code>-p</code> means port. After this, everything should work.</p>
<figure><img src="https://github.com/user-attachments/assets/5d233de3-7e78-4a32-a30d-c0766af74106" alt="The T-Pot dashboard on port 64297" loading="lazy"><figcaption>The T-Pot dashboard on port 64297</figcaption></figure>
<p>Inside the browser of VirtualBox, I put <code>https://Public-IP:64297</code>. 64297 is the listening port, which I found through the telekom-security GitHub repository. The reason I did it inside VirtualBox is that when I tried to access the site from my laptop it said "unsecure" — which we expect — but it wouldn't let me advance past the warning. So I tried Firefox inside my VirtualBox and was finally able to advance. When loading, it asks for the username and password you set during the T-Pot setup.</p>

<h3>Results</h3>
<p>I let my honeypot run for less than 2 hours, and during that time I was able to get these results.</p>
<figure><img src="https://github.com/user-attachments/assets/84ebec27-498c-41c1-868a-9314ffa6463a" alt="Attack map and event totals" loading="lazy"><figcaption>Attack map and event totals</figcaption></figure>
<figure><img src="https://github.com/user-attachments/assets/9a19e497-247c-4914-9b73-bacc7e59b0e5" alt="Most-attempted usernames and passwords" loading="lazy"><figcaption>Most-attempted usernames and passwords</figcaption></figure>
<figure><img src="https://github.com/user-attachments/assets/b8b2cede-5dda-40c6-a04d-9adcb1be2952" alt="Most-targeted ports" loading="lazy"><figcaption>Most-targeted ports</figcaption></figure>
<p>I was able to see that the attackers are mostly coming from Europe and the East Coast of America. Attackers are mostly trying <code>root</code> for the username and nothing for the password. To me it is really interesting how basic the usernames and passwords they're trying are. I could also see which port they're attacking, which in this case is mostly port 22.</p>

<h3>Conclusion</h3>
<p>This was a very fun project to build, and I definitely learned a lot while I was building it. I ran into a couple of challenges, including troubleshooting my connection, missing Docker containers at times, and T-Pot not working. But in reality, this is what the IT and cyber security field is all about: running into an error, stressing about it, then figuring out a way to fix it and make it work.</p>
<p>I am glad that I was able to fix my mistakes and finish this project. I learned a lot about blue team concepts, hands-on troubleshooting, Linux, the attacker mindset, cloud infrastructure, and networking.</p>
<p><a href="https://github.com/AlmerGaringan/HoneyPot" target="_blank" rel="noopener">Repository on GitHub</a></p>
` },

  { slug:"pi-hole", title:"Pi-hole: a network-wide ad blocker", kind:"project",
    date:"2025-12-01", read:"8 min", tags:["pi-hole","dns","networking","raspberry pi"],
    excerpt:"My first project - a Raspberry Pi filtering DNS for every device on the network. 96 out of 100 on the AdBlock tester, and a crash course in DHCP, static IPs, and LAN addressing.",
    body:`
<p>A Pi-hole is a network-wide ad blocker and a DNS filter. The reason I decided to build a Pi-Hole is to block the ads that are in my network. I learned a lot through this project; some of the key concepts I acquired include DNS, Linux, and IP addressing.</p>
<figure><img src="https://github.com/user-attachments/assets/3fd9718b-fb90-4151-bc03-e505554d7202" alt="The Pi-hole admin dashboard" loading="lazy"><figcaption>The Pi-hole admin dashboard</figcaption></figure>

<h3>Hardware and OS</h3>
<ul>
  <li>Travel router</li>
  <li>Wireless ethernet adapter</li>
  <li>Raspberry Pi OS and Ubuntu Server</li>
</ul>

<h3>Installation</h3>
<p>The first command when I was building this project was:</p>
<pre><code>sudo apt update
sudo apt full-upgrade</code></pre>
<p>The first thing I did was update and fully upgrade my system. This allows your Pi packages to be fully updated to make sure they're up to date.</p>
<p>Then I ran this command:</p>
<pre><code>curl -sSL https://install.pi.hole.net | bash</code></pre>
<p><code>curl</code> is used to fetch or retrieve the data in that URL or from the server. In <code>-sSL</code>, <code>-s</code> means silent mode, <code>-S</code> only shows errors, and <code>-L</code> follows any redirection.</p>
<p>Bash receives what the curl command wants to fetch, then turns that input into text and runs the script line by line.</p>
<p>After you type this command in, an installation wizard will pop up. This will allow you to customize your Pi-hole.</p>
<p>In your router interface, you want to go to your DNS server settings and manually type out your Pi-hole IP address. A way to find out your IP address is by completing your installation, which gives you your IP address shown as <code>IPV4: (IP Address)</code>.</p>
<figure><img src="https://github.com/user-attachments/assets/79398870-9ecb-4e79-8242-1022c46025d0" alt="Pointing the router's DNS settings at the Pi-hole" loading="lazy"><figcaption>Pointing the router's DNS settings at the Pi-hole</figcaption></figure>
<p>Another way of finding out your Pi-hole IP address is through the CLI:</p>
<pre><code>ip addr</code></pre>
<p>This will give you all of the IP addresses on your Pi. So whatever interface you choose during the installation, whether it's <code>wlan0</code> or <code>eth0</code> or some other one, the IP address will be under whatever you choose.</p>
<p>After this, I enabled my DHCP settings in my Pi-hole admin. In this, you will get a range of IP addresses to hand out from start to end, then you also have to put your router IP address, and lastly your netmask. I was able to find all of this through my travel router. In the LAN private network, I was given the start and end IP address, the netmask, and the router IP address. So I added my LAN private network into my Pi-hole DHCP server settings.</p>
<p>Lastly, I needed to add my Pi-Hole as a client in my travel router, so I had to add my Pi to my LAN private network by putting in my Pi-Hole IPv4 address and also the static IPv6 address of my Pi-Hole. But then I realized that my WiFi connection from my travel router is different from my main router, so when I connected my devices to my travel router's WiFi, I was finally able to see my Pi-Hole work with all of my devices across my network.</p>

<h3>Results</h3>
<p>Seeing my score being a 96 out of 100 from an AdBlock tester shows that my Pi-hole works and blocks out adware, spyware, and malware queries on my network.</p>
<figure><img src="https://github.com/user-attachments/assets/f348bc2f-dc0c-48d4-b66a-aa1b56d0ea47" alt="96 out of 100 on the AdBlock tester" loading="lazy"><figcaption>96 out of 100 on the AdBlock tester</figcaption></figure>
<p>These are my results after 2 hours of my Pi-hole working. I noticed that there were no more pop-up ads on sites that I would visit, and I also noticed my browsing speed has gotten faster.</p>
<figure><img src="https://github.com/user-attachments/assets/63d8625d-da33-4682-bc92-5cc317a1b70f" alt="Query stats after two hours" loading="lazy"><figcaption>Query stats after two hours</figcaption></figure>

<h3>Key takeaways</h3>
<p>Key takeaways I took from my first project were to strengthen my Linux skills and also learning about static IP, DNS, LAN, DHCP, and IP addresses. I was also able to gain hands-on experience and learn throughout this project about network security and privacy, understanding how a Pi-hole can reduce the amount of spyware, adware, and malware queries that are happening on my network.</p>
<p>I was finally able to deepen my skills and knowledge on how IP addresses, LAN, DHCP, DNS, and malicious or unwanted queries play an important role in the IT and cyber security industry.</p>
<p><a href="https://github.com/AlmerGaringan/Pi-Hole" target="_blank" rel="noopener">Repository on GitHub</a></p>

/* ---------------------------------------------------------------- parser */
function run(raw){
  const line = raw.trim();
  if(!line) return;
  history.push(line); hIndex = history.length;
  const [verb, ...rest] = line.split(/\s+/);
  const arg = rest.join(" ").toLowerCase();
  const v = verb.toLowerCase();

  if(v==="clear"){ out.innerHTML=""; setPath("~");
    push("clear", `<p class="note">Screen cleared.</p>
      <table class="tbl"><tbody>
        <tr><td><button class="cmdchip" data-run="home">home</button></td><td class="desc">Back to the start</td></tr>
        <tr><td><button class="cmdchip" data-run="ls">ls</button></td><td class="desc">See everything</td></tr>
        <tr><td><button class="cmdchip" data-run="help">help</button></td><td class="desc">Every command</td></tr>
      </tbody></table>`, {noscroll:true}); return; }
  if(v==="help"||v==="?"||v==="man"){ setPath("~"); push(line, VIEWS.help()); return; }
  if(v==="whoami"){ push(line, VIEWS.whoami()); return; }
  if(v==="contact"||v==="email"){ setPath("~/contact"); push(line, VIEWS.contact()); return; }
  if(v==="pwd"){ push(line, `<p class="ok">${esc(cwd)}</p>`); return; }

  if(v==="home"||v==="~"||(v==="cd" && (!arg||arg==="~"||arg==="..")))
    { setPath("~"); push(line, VIEWS.welcome()); return; }

  if(v==="ls"||v==="dir"||v==="cd"){
    if(!arg||arg==="~"||arg===".."){ setPath("~"); push(line, VIEWS.ls()); return; }
    if(arg.startsWith("cert")){ setPath("~/certs"); push(line, VIEWS.certs()); return; }
    if(arg.startsWith("project")){ setPath("~/projects"); push(line, VIEWS.projects()); return; }
    if(arg.startsWith("writeup")){ setPath("~/writeups"); push(line, `<p class="note">Write-up series — ${SERIES.length}.</p>` + seriesRows()); return; }
    const s = SERIES.find(x=>x.slug===arg||arg.includes(x.slug));
    if(s){ setPath("~/"+s.slug); push(line, VIEWS.series(s.slug)); return; }
    push(line, `<p class="err">No folder called "${esc(arg)}".</p><p class="note">Try <button class="cmdchip" data-run="ls">ls</button> to see the categories.</p>`);
    return;
  }

  if(v==="cat"||v==="open"||v==="read"||v==="less"){
    const key = arg.replace(/\.md$/,"").replace(/^bandit[\s-]*/,"");
    if(arg.replace(/\.md$/,"")==="about"||arg==="aboutme"){ setPath("~/about.md"); push(line, VIEWS.about()); return; }
    const doc = VIEWS.level(key);
    if(doc){ setPath("~/bandit/"+key); push(line, doc); return; }
    const s = SERIES.find(x=>x.slug===key);
    if(s){ setPath("~/"+s.slug); push(line, VIEWS.series(s.slug)); return; }
    const pr = VIEWS.post(key);
    if(pr){ setPath("~/"+key); push(line, pr); return; }
    const guess = BANDIT.find(l=>l.id.startsWith(key)||l.label.toLowerCase().includes(key));
    push(line, `<p class="err">There's no file called "${esc(arg)}".</p>` +
      (guess ? `<p class="note">Did you mean <button class="cmdchip" data-run="cat ${guess.id}">cat ${guess.id}</button>?</p>`
             : `<p class="note">Run <button class="cmdchip" data-run="ls">ls</button> to see what's available.</p>`));
    return;
  }

  if(v==="sudo"){ push(line, `<p class="err">almer is not in the sudoers file. This incident has been logged.</p><p class="note">Kidding — nothing was logged. Try <b>help</b>.</p>`); return; }
  if(v==="exit"||v==="quit"){ push(line, `<p class="note">There's no exit — it's a website.</p><p class="note">Run <button class="cmdchip" data-run="home">home</button> to start over.</p>`); return; }

  const near = COMMANDS.find(c=>c.cmd.startsWith(v)||v.startsWith(c.cmd.split(" ")[0]));
  push(line, `<p class="err">"${esc(verb)}" isn't a command here.</p>` +
    (near ? `<p class="note">Closest match: <button class="cmdchip" data-run="${esc(near.cmd)}">${esc(near.cmd)}</button> — ${esc(near.label)}</p>`
          : `<p class="note">No harm done. Click <button class="cmdchip" data-run="help">help</button> for the full list.</p>`));
}

/* ------------------------------------------------- click → type → run */
let busy = false;
function typeAndRun(text){
  if(busy) return;
  closeAC();
  if(reduced){ input.value=""; run(text); return; }
  busy = true;
  input.value = "";
  let i = 0;
  const tick = setInterval(()=>{
    input.value = text.slice(0, ++i);
    if(i >= text.length){
      clearInterval(tick);
      setTimeout(()=>{ input.value=""; busy=false; run(text); }, 190);
    }
  }, 28);
}

/* ------------------------------------------------------------ autocomplete */
let sel = -1;
function openAC(q){
  const matches = COMMANDS.filter(c=>c.cmd.toLowerCase().startsWith(q.toLowerCase())).slice(0,6);
  if(!q || !matches.length){ closeAC(); return; }
  sel = -1;
  ac.innerHTML = matches.map(m=>`<button data-cmd="${esc(m.cmd)}"><b>${esc(m.cmd)}</b><span>${esc(m.label)}</span></button>`).join("");
  ac.querySelectorAll("button").forEach(b=>b.addEventListener("mousedown", e=>{ e.preventDefault(); typeAndRun(b.dataset.cmd); }));
}
function closeAC(){ ac.innerHTML=""; sel=-1; }
function acItems(){ return [...ac.querySelectorAll("button")]; }

/* --------------------------------------------------------------- history */
const history = []; let hIndex = 0;

input.addEventListener("input", ()=> openAC(input.value));
input.addEventListener("blur", ()=> setTimeout(closeAC,120));
input.addEventListener("keydown", e=>{
  const items = acItems();
  if(e.key==="Enter"){
    e.preventDefault();
    if(sel>-1 && items[sel]){ typeAndRun(items[sel].dataset.cmd); return; }
    const val = input.value; input.value=""; closeAC(); run(val); return;
  }
  if(e.key==="Tab" && items.length){ e.preventDefault(); input.value = items[Math.max(sel,0)].dataset.cmd; closeAC(); return; }
  if(e.key==="Escape"){ closeAC(); return; }
  if(e.key==="ArrowDown"){
    if(items.length){ e.preventDefault(); sel=(sel+1)%items.length; items.forEach((b,i)=>b.classList.toggle("sel",i===sel)); return; }
    if(hIndex < history.length-1){ e.preventDefault(); input.value = history[++hIndex]; }
    else { hIndex = history.length; input.value=""; }
    return;
  }
  if(e.key==="ArrowUp"){
    if(items.length){ e.preventDefault(); sel=(sel-1+items.length)%items.length; items.forEach((b,i)=>b.classList.toggle("sel",i===sel)); return; }
    if(hIndex>0){ e.preventDefault(); input.value = history[--hIndex]; }
    return;
  }
});
