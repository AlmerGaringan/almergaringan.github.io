<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almer Garingan | Cybersecurity Blog</title>
<meta name="description" content="Almer Garingan's cybersecurity blog: OverTheWire Bandit write-ups, homelab projects, experience and certifications, presented as a blocky game menu.">
<meta name="theme-color" content="#2F5FB8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Tiny5&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --px:"Tiny5","Press Start 2P",ui-monospace,monospace;
  --logo:"Press Start 2P","Tiny5",ui-monospace,monospace;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --white:#FFFFFF;
  --gray:#A8A8A8;
  --dim:#7E7E7E;
  --yellow:#FFFF55;
  --hover:#FFFFA0;
  --green:#7CD35A;
  --aqua:#55FFFF;
  --red:#FF5555;
  --gold:#FFAA00;
  --purple:#D27BFF;
  --shadow:#3F3F3F;
  --stone:none; --stone-hi:none; --dirt:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#2F5FB8}
body{
  margin:0;min-height:100vh;color:var(--white);
  font-family:var(--px);font-size:18px;line-height:1.5;font-variant-ligatures:none;
  overflow-x:hidden;background:#2F5FB8;
}
a{color:var(--aqua)}
::selection{background:var(--yellow);color:#000}
:focus-visible{outline:2px solid var(--white);outline-offset:2px}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===================== panorama ===================== */
#world{position:fixed;inset:0;width:100%;height:100%;z-index:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;transition:background .35s ease,backdrop-filter .35s ease;
  background:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,0) 40%,rgba(0,0,0,.35) 100%)}
body.inner .veil{background:rgba(8,6,4,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

#app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column}

/* ===================== text shadow helpers ===================== */
.ts{text-shadow:2px 2px 0 var(--shadow)}

/* ===================== stone buttons ===================== */
.btn{
  position:relative;display:flex;align-items:center;justify-content:center;gap:10px;
  height:50px;padding:0 14px;width:100%;
  font-family:var(--px);font-size:23px;font-weight:400;letter-spacing:.6px;color:var(--white);
  text-decoration:none;text-shadow:2px 2px 0 #1c1c1c;cursor:pointer;
  background:#5e5e5e var(--stone);background-size:64px 64px;image-rendering:pixelated;
  border:2px solid #000;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.38), inset -2px -4px 0 rgba(0,0,0,.42);
  user-select:none;-webkit-user-select:none;white-space:nowrap;
}
.btn:hover,.btn:focus-visible{
  border-color:#fff;color:var(--hover);outline:none;
  background-color:#7E86A8;background-image:var(--stone-hi);
}
.btn:active{box-shadow:inset 2px 2px 0 rgba(0,0,0,.35), inset -2px -2px 0 rgba(255,255,255,.2)}
.btn[disabled]{color:var(--gray);cursor:default;background-color:#2c2c2c;background-image:none;border-color:#000;box-shadow:none}
.btn.sq{width:50px;flex:none;padding:0}
.btn svg{width:24px;height:24px;flex:none}
.btn .lbl{overflow:hidden;text-overflow:ellipsis}

/* ===================== title screen ===================== */
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 16px 96px}
.logo{position:relative;text-align:center;margin:0 0 6px;font-weight:400;line-height:1}
.logo .ln{display:block;position:relative;font-family:var(--logo);
  font-size:clamp(30px,8.4vw,74px);letter-spacing:.02em;padding:0 .05em}
.logo .ln + .ln{margin-top:.12em}
.logo .ln::before{ /* the extruded back */
  content:attr(data-t);position:absolute;inset:0;padding:inherit;color:#1d1d1d;
  text-shadow:.04em .04em 0 #2e2e2e,.08em .08em 0 #262626,.11em .11em 0 #1a1a1a;
  -webkit-text-stroke:.05em #000;z-index:0}
.logo .ln span{position:relative;z-index:1;color:#bdbdbd;
  background:linear-gradient(#e6e6e6 0 22%,#c0c0c0 22% 48%,#9a9a9a 48% 74%,#7a7a7a 74%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logowrap{position:relative;display:flex;flex-direction:column;align-items:center}
.splash{position:absolute;right:-10%;top:clamp(56px,13vw,118px);z-index:3;
  font-family:var(--px);font-weight:400;font-size:clamp(14px,2.2vw,20px);color:var(--yellow);
  text-shadow:2px 2px 0 #3F3F00;white-space:nowrap;transform:rotate(-17deg);transform-origin:center;
  animation:splash .55s ease-in-out infinite alternate;pointer-events:none}
@keyframes splash{from{transform:rotate(-17deg) scale(.94)}to{transform:rotate(-17deg) scale(1.06)}}
.menu{width:min(480px,100%);margin-top:clamp(28px,6vh,56px);display:grid;gap:10px}
.menu .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu .spacer{height:10px}
.menu .bottom{display:grid;grid-template-columns:54px 1fr 1fr 54px;gap:10px}
.menu .btn.big{height:56px;font-size:26px}
.menu .bottom .btn{height:54px}
.menu .bottom .btn.sq{width:54px}
.tools{position:fixed;left:12px;bottom:12px;z-index:4;display:flex;align-items:center;gap:8px}
.tools .btn.sq{width:46px;height:46px}
.tools .lbl{font-size:24px}
.tools .ver{margin-left:6px;font-size:16px;text-shadow:2px 2px 0 var(--shadow)}
body.inner .tools .ver{display:none}
.corner{position:fixed;bottom:0;z-index:3;padding:8px 12px;font-size:15px;color:var(--white);text-shadow:2px 2px 0 var(--shadow);line-height:1.35}
.corner.l{left:0}.corner.r{right:0;text-align:right}
.corner a{color:inherit;text-decoration:none}
.corner a:hover{color:var(--hover);text-decoration:underline}
.corner .dis{color:#e8e8e8;font-size:12px}
.hint{color:#E6E6E6;font-size:15px}
.hint kbd{font-family:var(--px);color:var(--white);background:rgba(0,0,0,.5);padding:0 5px;border:1px solid #555}

/* ===================== inner screens ===================== */
.scr{flex:1;display:flex;flex-direction:column;align-items:center;padding:22px 16px 0;min-height:100vh}
.scr-title{margin:0;font-family:var(--px);font-weight:400;font-size:clamp(28px,5vw,40px);letter-spacing:.5px;text-align:center;text-shadow:2px 2px 0 var(--shadow)}
.scr-sub{margin:4px 0 0;color:var(--gray);font-size:15px;text-align:center;text-shadow:2px 2px 0 #222}
.crumbs{margin:2px 0 0;font-size:14px;color:var(--gray);text-align:center}
.crumbs a{color:var(--gray);text-decoration:none}
.crumbs a:hover{color:var(--hover)}
.panel{
  width:min(900px,100%);margin:16px 0 0;flex:1;
  border-top:2px solid #000;border-bottom:2px solid #000;
  box-shadow:0 2px 0 rgba(255,255,255,.12) inset, 0 -2px 0 rgba(255,255,255,.12) inset;
  background:linear-gradient(rgba(0,0,0,.58),rgba(0,0,0,.58)), #3a2a1c var(--dirt);
  background-size:auto, 64px 64px;image-rendering:pixelated;
  padding:14px clamp(10px,2.5vw,22px) 22px;
}
.panel.narrow{width:min(760px,100%)}
.panel.wide{width:min(1180px,100%)}
/* about */
.about{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;max-width:1080px;margin:0 auto;padding:6px 0}
.about-l{display:flex;flex-direction:column;gap:10px}
.photo{position:relative;aspect-ratio:1;background:#3a3328;border:4px solid #fff;box-shadow:0 0 0 2px #000, inset 0 0 0 2px #000;overflow:hidden;display:flex;align-items:center;justify-content:center}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.photo .mono{font-family:var(--logo);font-size:64px;color:#8a7d64;text-shadow:4px 4px 0 #1d1912}
.khaki{background:#5b5240}
.plate{padding:12px 14px;font-size:32px;line-height:1.1;color:#fff;text-shadow:2px 2px 0 #1c1c1c;background:#5b5240;border:2px solid #000;box-shadow:inset 2px 2px 0 rgba(255,255,255,.18), inset -2px -2px 0 rgba(0,0,0,.35)}
.divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0}
.divider span{width:60px;height:2px;background:rgba(255,255,255,.18)}
.divider svg{width:30px;height:30px}
.facts{margin:0;display:grid;gap:6px}
.facts div{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;background:rgba(0,0,0,.45);border:2px solid #4a4a4a}
.facts dt{color:var(--gray);font-size:17px}
.facts dd{margin:0;color:#fff;font-size:17px;text-align:right}
.about-l .chips{margin-top:2px}
.about-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.about-btns .wide{grid-column:1 / -1}
.pts a{color:var(--aqua);font-family:var(--px)}
.about-btns .btn{height:46px;font-size:20px}
.about-r{display:flex;flex-direction:column;gap:14px;min-width:0}
.bio{margin:0;padding:16px 20px;font-size:19px;line-height:1.6;color:#fff;text-shadow:2px 2px 0 #1c1c1c;background:#5b5240;border:2px solid #000;box-shadow:inset 2px 2px 0 rgba(255,255,255,.15), inset -2px -2px 0 rgba(0,0,0,.35)}
.now-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:4px}
.now-h h2{margin:0;font-family:var(--px);font-weight:400;font-size:30px;text-shadow:2px 2px 0 #1c1c1c}
.now-h span{color:var(--gray);font-size:15px}
.slots{display:grid;gap:10px}
.slot{background:#5b5240;border:2px solid #000;box-shadow:inset 2px 2px 0 rgba(255,255,255,.15), inset -2px -2px 0 rgba(0,0,0,.35)}
.slot summary{list-style:none;display:grid;grid-template-columns:58px minmax(0,1fr) 24px;align-items:center;gap:16px;padding:12px 16px;cursor:pointer}
.slot summary::-webkit-details-marker{display:none}
.slot summary:hover{background:rgba(255,255,255,.06)}
.slot summary:focus-visible{outline:2px solid #fff;outline-offset:-4px}
.slot-ic{width:58px;height:58px;background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737;padding:6px;box-sizing:border-box}
.slot-ic svg{width:100%;height:100%;display:block}
.slot-txt{display:flex;flex-direction:column;min-width:0}
.slot-l{font-size:14px;letter-spacing:2px;text-transform:uppercase;color:#CFC6B0}
.slot-v{font-size:22px;color:#fff;text-shadow:2px 2px 0 #1c1c1c;line-height:1.25}
.slot-plus::before{content:"+";color:var(--green);font-size:30px;line-height:1;text-shadow:2px 2px 0 #1d4d10}
.slot[open] .slot-plus::before{content:"−"}
.slot-more{padding:0 16px 14px 90px;font-family:var(--mono);font-size:14.5px;line-height:1.6;color:#EEE7D6}
.spotify{margin:10px 0 8px}
.spotify iframe{display:block;border:0;border-radius:12px;background:#121212}
.slot-list{margin:8px 0 6px;padding-left:20px}
.slot-list li{margin:2px 0}
.slot-list li::marker{color:var(--green)}
.slot-more a,.linkbtn{color:var(--aqua);font-family:var(--px);font-size:17px}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}

/* blog */
.scr-top{width:100%;display:flex;justify-content:center}
.blog-search{display:block;width:min(800px,100%);margin:14px auto 0;padding:12px 16px;font-family:var(--px);font-size:22px;color:#fff;
  background:#000;border:2px solid #A0A0A0;outline:none;box-sizing:border-box}
.blog-search::placeholder{color:#8a8a8a}
.blog-search:focus{border-color:#fff}
.posts{list-style:none;margin:0 auto;padding:6px 0;max-width:1060px;display:grid;gap:8px}
.posts li[hidden]{display:none}
.post{width:100%;display:grid;grid-template-columns:100px minmax(0,1fr);gap:16px;align-items:center;padding:8px;text-align:left;
  background:rgba(0,0,0,.35);border:2px solid transparent;color:#fff;cursor:pointer;font-family:var(--px)}
.post:hover{border-color:#777}
.post[aria-pressed="true"]{border-color:#fff;background:rgba(0,0,0,.6)}
.post:focus-visible{outline:2px solid #fff;outline-offset:2px}
.post-ic{width:100px;height:100px;background:linear-gradient(180deg,#6aa8e8,#9fd0f5 60%,#5c9b3c 60%,#4a7e30);border:2px solid #000;padding:14px;box-sizing:border-box;display:block}
.post-ic svg{width:100%;height:100%;display:block}
.post-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.post-t{font-size:26px;line-height:1.15;text-shadow:2px 2px 0 #1c1c1c}
.post-x{font-size:18px;color:#C8C8C8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-m{font-size:17px;color:#A8A8A8}
.post-none{text-align:center;color:var(--gray);font-size:18px}
.blog-foot{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(620px,100%)}
.blog-foot .row2{width:100%}
.post-count{margin:0;font-size:17px;color:#D0D0D0;text-shadow:2px 2px 0 #000}
.btn[disabled]{opacity:.55}

/* options */
.opts-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.65);overflow:auto}
.opts{width:min(520px,100%);margin:auto;padding:22px 24px 24px;background:#C6C6C6;color:#3F3F3F;border:3px solid #000;
  box-shadow:inset 3px 3px 0 #fff, inset -3px -3px 0 #555;display:flex;flex-direction:column;gap:8px}
.opts h2{margin:0 0 6px;text-align:center;font-family:var(--px);font-weight:400;font-size:28px;color:#3F3F3F}
.opt-l{margin:8px 0 2px;font-size:20px;color:#3F3F3F}
.opt-song{font-size:18px;color:#222}
.opt-off{color:#666}
.opt-note{margin:2px 0 4px;font-size:15px;color:#555;line-height:1.4}
.opt-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts .btn{height:44px;font-size:20px}
.opts .btn.sel{background-color:#7E86A8;background-image:var(--stone-hi);color:var(--yellow);border-color:#fff}
.opt-done{margin-top:12px;height:54px !important;font-size:26px !important}
#optvol{-webkit-appearance:none;appearance:none;width:100%;height:12px;margin:8px 0 4px;border:2px solid #000;cursor:pointer;
  background:linear-gradient(90deg,#5CB82C 0 var(--p),#2b2b2b var(--p) 100%)}
#optvol::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:26px;background:#d0d0d0;border:2px solid #000;box-shadow:inset -2px -2px 0 #777, inset 2px 2px 0 #fff}
#optvol::-moz-range-thumb{width:14px;height:24px;border-radius:0;background:#d0d0d0;border:2px solid #000}
#optvol:focus-visible{outline:2px solid #fff;outline-offset:3px}
.reduce .splash{animation:none}

/* resume viewer (only used when the page is opened as a local file) */
.resume-wrap{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;background:rgba(0,0,0,.75)}
.resume-frame{flex:1;width:min(900px,100%);border:3px solid #000;background:#fff}

/* contact book */
.book-wrap{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;padding:16px;background:rgba(0,0,0,.7);overflow:auto}
.book{margin-top:auto;flex:none;display:grid;grid-template-columns:1fr 1fr;gap:6px;width:min(1080px,100%);padding:10px;background:#6b4423;border:3px solid #2b1a0c;box-shadow:inset 0 0 0 3px #8a5a30, 0 24px 60px rgba(0,0,0,.6)}
.page{position:relative;min-height:440px;padding:26px 32px 30px;background:#F6EEDB;color:#3b3226;box-shadow:inset 0 0 0 2px #e3d6b8, inset 0 0 40px rgba(120,90,40,.12);display:flex;flex-direction:column;gap:22px}
.page::before,.page::after{content:"";position:absolute;width:20px;height:20px;border:3px solid #cbbd9c}
.page::before{left:12px;top:12px;border-right:0;border-bottom:0}
.page::after{right:12px;bottom:12px;border-left:0;border-top:0}
.pg-h{margin:0;text-align:center;font-family:var(--px);font-weight:400;font-size:24px;color:#7a6c55}
.fld{display:flex;flex-direction:column;gap:6px}
.fld span{font-size:16px;letter-spacing:2px;text-transform:uppercase;color:#7a6c55}
.fld input{font-family:var(--px);font-size:20px;color:#2b241a;background:transparent;border:0;border-bottom:2px solid #9c8e74;padding:8px 2px;outline:none}
.fld input:focus{border-bottom-color:#3b3226}
.fld input::placeholder,.page textarea::placeholder{color:#b4a688}
.pg-note{margin:auto 0 0;font-size:16px;color:#7a6c55}
.page textarea{flex:1;min-height:250px;resize:none;font-family:var(--px);font-size:19px;line-height:36px;color:#2b241a;border:0;outline:none;padding:0 2px;
  background:transparent repeating-linear-gradient(transparent 0 34px,#c9bc9f 34px 36px);background-attachment:local}
.count{margin:0;text-align:right;font-size:16px;color:#7a6c55}
.book-x{position:absolute;right:14px;top:10px;width:40px;height:40px;background:none;border:0;font-size:30px;line-height:1;color:#7a6c55;cursor:pointer}
.book-x:hover{color:#2b241a}
.book-btns{margin-bottom:auto;flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,170px));gap:12px}
.book-btns .btn{height:46px;font-size:20px}
.book-done{grid-template-columns:1fr}
.done-page{min-height:400px;align-items:center;justify-content:center;text-align:center;gap:10px}
.done-k{margin:0;font-size:18px;letter-spacing:3px;text-transform:uppercase;color:#7a6c55}
.done-h{margin:0;font-size:36px;color:#2b241a}
.done-s{margin:0;font-size:22px;color:#5a4e3c}
.book-btns.one{grid-template-columns:minmax(0,200px)}
.book-status{margin:0;max-width:720px;text-align:center;font-size:17px;color:#fff;text-shadow:2px 2px 0 #000;min-height:1em}
.book-status a{color:var(--aqua)}

/* experience timeline */
.timeline{max-width:960px;margin:0 auto;padding:8px 0}
.job,.sk{margin:0;display:grid;grid-template-columns:200px 1fr;gap:10px 28px;padding:22px 0;border-bottom:2px solid rgba(255,255,255,.10)}
.job:last-child,.sk:last-child{border-bottom:0}
.sk{grid-template-columns:1fr;gap:0}
.sk .chips{margin-top:2px}
.job-when{color:var(--gray);font-size:18px;line-height:1.5;padding-top:4px}
.job-h,.sk-h{margin:0 0 10px;font-family:var(--px);font-weight:400;font-size:25px;line-height:1.25;color:#fff;text-shadow:2px 2px 0 #1c1c1c}
.job-org{color:var(--gray)}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pts li{position:relative;padding-left:22px;font-size:18px;line-height:1.5;color:#EDEDED}
.pts li::before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;background:var(--green);box-shadow:1px 1px 0 #1d4d10}
.pts .sub{color:var(--gray)}
.pts .wip{color:var(--purple)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:16px;padding:3px 9px;color:#fff;background:rgba(0,0,0,.55);border:2px solid #555;box-shadow:inset 1px 1px 0 rgba(255,255,255,.12)}
.foot{position:sticky;bottom:0;width:100%;display:flex;justify-content:center;padding:14px 16px 18px;
  background:linear-gradient(transparent,rgba(0,0,0,.55) 40%)}
.foot .row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(620px,100%)}
.foot .row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(420px,100%)}
.foot .row1{width:min(320px,100%)}

/* list rows (world-select style) */
.list{display:grid;gap:6px}
.entry{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;width:100%;text-align:left;
  padding:6px;border:2px solid transparent;background:transparent;cursor:pointer;text-decoration:none;color:var(--white)}
.entry:hover,.entry:focus-visible{border-color:var(--gray);background:rgba(0,0,0,.35);outline:none}
.entry:focus-visible{border-color:#fff}
.entry .ic{width:64px;height:64px;background:#000;border:1px solid #333;display:block}
.entry .ic svg{width:100%;height:100%;display:block}
.entry .t{display:block;font-weight:400;font-size:22px;line-height:1.25}
.entry .m{display:block;color:var(--gray);font-size:15px;line-height:1.35;margin-top:2px}
.entry .x{display:block;color:#C9C9C9;font-family:var(--mono);font-size:13.5px;line-height:1.55;margin-top:6px}
.entry.static{cursor:default}
.entry.static:hover{border-color:transparent;background:transparent}
.tag{display:inline-block;font-size:13px;padding:0 6px;margin-right:6px;border:1px solid currentColor;line-height:1.5}
.tag.writeup{color:var(--aqua)}.tag.project{color:var(--green)}.tag.job{color:var(--gold)}

/* level grid */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.lgrid .btn{height:44px;font-size:18px}
.lgrid .btn small{color:var(--gray);font-size:13px;margin-left:2px}
.lgrid .btn:hover small{color:var(--hover)}

/* achievements */
.adv{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.toast{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start;padding:10px 12px;
  background:#212121;border:2px solid #000;box-shadow:inset 0 0 0 2px #555, inset 0 0 0 4px #000}
.toast .ic{width:52px;height:52px;background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737;padding:4px}
.toast .ic svg{width:100%;height:100%;display:block}
.toast .h{font-size:17px;font-weight:400;color:var(--yellow)}
.toast.wip .h{color:var(--purple)}
.toast .n{font-size:19px;color:var(--white);line-height:1.3;margin-top:2px}
.toast .d{font-family:var(--mono);font-size:13px;color:var(--gray);margin-top:6px;line-height:1.55}

/* key/value (contact) */
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:center;font-size:17px}
.kv dt{color:var(--gray)}
.kv dd{margin:0;word-break:break-word}
.kv dd a{color:var(--aqua)}
.ok{color:var(--green)}

/* ===================== documents ===================== */
.doc{font-family:var(--mono);font-size:15px;line-height:1.75;color:#E6E6E6;max-width:72ch;margin:0 auto}
.doc h2{font-family:var(--px);font-weight:400;font-size:24px;line-height:1.25;color:var(--white);margin:6px 0 4px;text-shadow:2px 2px 0 #222}
.doc h3{font-family:var(--px);font-weight:400;font-size:20px;color:var(--yellow);margin:28px 0 8px;text-shadow:2px 2px 0 #3F3F00}
.doc .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--px);font-size:15px;color:var(--gray);margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid rgba(255,255,255,.12)}
.doc p{margin:0 0 12px}
.doc ul{margin:0 0 14px;padding-left:20px}
.doc li{margin:4px 0}
.doc li::marker{color:var(--green)}
.doc b{color:#fff;font-weight:600}
.doc a{color:var(--aqua)}
.doc code{font-family:var(--mono);font-size:.92em;color:var(--green);background:rgba(0,0,0,.45);padding:1px 5px;border:1px solid rgba(255,255,255,.08);word-break:break-all}
.doc pre{margin:10px 0 14px;padding:12px 14px;background:rgba(0,0,0,.72);border:2px solid #000;box-shadow:inset 0 0 0 1px #3a3a3a;overflow:auto;max-height:520px;font-size:13px;line-height:1.55}
.doc pre code{background:none;border:0;padding:0;color:#DADADA;word-break:normal;white-space:pre}
.doc figure{margin:16px 0 18px}
.doc img{display:block;max-width:100%;height:auto;border:2px solid #000;box-shadow:0 0 0 2px #555}
.doc figcaption{font-family:var(--px);font-size:14px;color:var(--gray);margin-top:6px}
.job{margin:0 0 16px}
.job-h{color:#fff}
.job-d{font-family:var(--px);font-size:14px;color:var(--gray)}

.err{color:var(--red)}

/* ===================== chat ===================== */
.chat{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;padding:0 6px 70px}
.chat.open{padding-bottom:6px}
.log{max-width:min(640px,100%);display:flex;flex-direction:column;gap:0;margin-bottom:4px}
.msg{font-family:var(--px);font-size:19px;line-height:1.35;padding:2px 6px;background:rgba(0,0,0,.5);text-shadow:2px 2px 0 #222;transition:opacity .6s ease;word-break:break-word}
.msg.gone{opacity:0}
.msg .y{color:var(--yellow)}.msg .g{color:var(--gray)}.msg .r{color:var(--red)}.msg .a{color:var(--aqua)}
.msg button{pointer-events:auto;background:none;border:0;padding:0;color:var(--aqua);text-decoration:underline;cursor:pointer;font:inherit;text-shadow:inherit}
.chatbar{display:none;pointer-events:auto;position:relative}
.chat.open .chatbar{display:block}
.chat.open .msg{opacity:1 !important}
.chatbar input{width:100%;font-family:var(--px);font-size:20px;color:#fff;background:rgba(0,0,0,.6);border:0;padding:6px 8px;outline:none;caret-color:#fff}
.sugg{position:absolute;left:0;bottom:100%;margin-bottom:4px;background:rgba(0,0,0,.85);min-width:220px;max-width:100%}
.sugg button{display:block;width:100%;text-align:left;background:none;border:0;padding:4px 10px;font-family:var(--px);font-size:18px;color:#D0D0D0;cursor:pointer;pointer-events:auto}
.sugg button b{color:var(--yellow);font-weight:400;margin-right:8px}
.sugg button.sel,.sugg button:hover{color:#fff;background:rgba(255,255,255,.08)}

/* ===================== small screens ===================== */
@media (max-width:560px){
  body{font-size:16px}
  .title{padding:36px 16px 120px}
  .splash{right:-4%;top:58px}
  .corner.l{display:none}
  .corner.r{left:0;text-align:center}
  .btn{font-size:21px;height:48px}
  .btn.sq{width:48px}
  .menu .bottom{grid-template-columns:48px 1fr 1fr 48px}
  .menu .btn.big{height:52px;font-size:23px}
  .menu .bottom .btn{height:48px}
  .menu .bottom .btn.sq{width:48px}
  .tools .ver{display:none}
  body.inner .tools{display:none}
  .title{padding-bottom:150px}
  .corner.r{bottom:64px}
  .corner{font-size:12px;padding:6px 10px}
  .corner .dis{font-size:10.5px}
  .corner.l .hint{display:none}
  .entry{grid-template-columns:48px 1fr;gap:10px}
  .entry .ic{width:48px;height:48px}
  .entry .t{font-size:16.5px}
  .lgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .adv{grid-template-columns:1fr}
  .doc{font-size:14.5px}
  .doc pre{font-size:12px}
  .foot .row3 .btn{font-size:15px;padding:0 8px}
  .kv{grid-template-columns:1fr;gap:2px}
  .post{grid-template-columns:64px minmax(0,1fr);gap:10px}
  .post-ic{width:64px;height:64px;padding:8px}
  .post-t{font-size:20px}
  .post-x{font-size:15px;white-space:normal}
  .post-m{font-size:14px}
  .blog-search{font-size:18px}
  .about{grid-template-columns:1fr}
  .about-l{max-width:340px;margin:0 auto;width:100%}
  .plate{font-size:26px}
  .bio{font-size:16.5px;padding:12px 14px}
  .slot summary{grid-template-columns:44px minmax(0,1fr) 20px;gap:12px;padding:10px 12px}
  .slot-ic{width:44px;height:44px;padding:4px}
  .slot-v{font-size:18px}
  .slot-more{padding:0 12px 12px 12px}
  .book{grid-template-columns:1fr}
  .page{min-height:0;padding:20px 20px 22px}
  .page textarea{min-height:180px}
  .job{grid-template-columns:1fr;gap:4px}
  .job-when{font-size:16px}
  .job-h,.sk-h{font-size:21px}
  .pts li{font-size:16.5px}
  .chip{font-size:14.5px}
  .kv dd{margin-bottom:10px}
}
@media (prefers-reduced-motion:reduce){
  .splash{animation:none}
  .veil{transition:none}
}

<p>After I cat the file, I decided to xxd the file. The xxd command is used to make a hex dump or to reverse one. Also, -r is for the reverse operation. I tried to reverse the file, and I got nothing.</p>
<pre><code>mktemp -d

<p>In this level, they had already created a directory for us to move the file into. That’s why we used mktemp -d. This gave us the pathway to the directory. After finding that out, I cp (copy files or directories) the data.txt file to the new directory. Eventually, I cd into the new directory.</p>
<pre><code>xxd -r data.txt &gt; data

<p>I tried to reverse the file input by redirecting it into another file called data. I file data to see what type of file it was and notice it was a gzip compressed data. Gzip is a compression tool. So I moved the data information into data1.gz, which is needed for when we need to decompress, so having that .gz or .bz2 will allow us to decompress the file. I decided to decompress the gzip file, which is done by gzip -d data1.gz.</p>
<p>I noticed when I ls the directory, there are two files: data1, which is where we just decompressed, and data.txt</p>
<pre><code>file data1
data1: bzip2 compressed data, block size = 900k
mv data1 data1.bz2
bzip2 -d data1.bz2
ls
data1  data.txt</code></pre>
<p>I wanted to see what type of file data1 was, and this time it was bzip2. Bzip2 is just another compression tool like gzip. So we have to move the file into data1.bz2 since now it’s a bzip2 compressed data file. After this, we have to repeat the process and decompress it with bzip2 -d data1.bz2. Then I ls the directory and found that data1 is still there.</p>
<pre><code>file data1
data1: gzip compressed data, was &quot;data4.bin&quot;, last modified: Tue Oct 14 09:26:00 2025, max compression, from Unix, original size modulo 2^32 20480
mv data1 data1.gz
gzip -d data1.gz
file data1
data1: POSIX tar archive (GNU)</code></pre>
<p>I file data1 and noticed it was gzip again, so I moved the file into data1.gz, then decided to decompress the file. Then again, I file the data1 to see what type of file it was. But this time it was something different called tar. Tar can hold multiple things in one.</p>
<pre><code>mv data1 data.tar
tar xf data.tar
ls
data5.bin  data.tar  data.txt</code></pre>
<p>So I moved data1 into data.tar, then I tar xf (gets the file) then I ls the directory, and now there are multiple files.</p>
<pre><code>file data.tar
data.tar: POSIX tar archive (GNU)
file data5.bin
data5.bin: POSIX tar archive (GNU)
mv data5.bin data.tar
tar xf data.tar
file data.tar
data.tar: POSIX tar archive (GNU)
ls
data6.bin  data.tar data.txt</code></pre>
<p>Again, I file data5.bin since that was new to the directory, and then I got tar. Then I went on to move the data5.bin to data.tar, then I tar xf <a href="http://data.tr" target="_blank" rel="noopener">data.tr</a> to once again file it, but I got the same thing tar. I ls the directory but noticed that data6.bin was new to the directory.</p>
<pre><code>file data6.bin

<p>You would want to file the data6.bin and notice again, you have to bzip2 decompress the file and then check what files are there in the directory. Then file data and notice again it’s tar, so you have to move the data file into data.tar, then tar xf data.tar. But once you ls you get a file called data8.bin, so once you see the file type, that file is you gzip decompress it.</p>
<pre><code>mv data8.bin data.gz
ls

gzip -d data.gz
ls
data  data.tar

data: ASCII text
cat data</code></pre>
<p>We go through the gzip decompression one more time, and at the end of the decompression. Once we ls the directory, we see a data file, and I file the data file and saw it’s an ASCII text, and that’s what we are looking for, and that basically confirms that we’ve reached the end of the hex dump. So we cat the file and get the password: <code>FO5dwFsc0cbaIiH0h8J2eUks2vdTDwAn</code></p>`},
  {id:"13-14", label:"Bandit 13-14", cmd:"ls", body:`<pre><code>ls 
sshkey.private
cat sshkey.private
[RSA private key omitted — you get your own copy when you run this level]
exit</code></pre>
<p>First off, I ls the directory, and then I cat the file to see what was inside of it. What was inside was the string for the sshkey.private. I tried ssh into bandit14, but I kept getting my permissions denied.</p>
<p>How I kept getting denied was by doing this;</p>
<pre><code>ssh bandit14@bandit.labs.overthewire.org -p 2220 -i sshkey.private
!!! You are trying to log into this SSH server with a password on port 2220 from localhost.
!!! Connecting from localhost is blocked to conserve resources.
!!! Please log out and log in again.</code></pre>
<p>So this was completely wrong</p>
<pre><code>almer@LAPTOP-OHBL0RFG:~$ echo &#x27;[RSA private key omitted — you get your own copy when you run this level]&#x27; &gt; private.key</code></pre>
<p>When I exited from bandit13@bandit and went into almer@LAPTOP-OHBL0RFG, I echoed the sshkey.private key and redirected it into a new file on my host.</p>
<pre><code>almer@LAPTOP-OHBL0RFG:~$ ls 
private.key</code></pre>
<p>After this, I tried ssh into bandit14 as I did before, and it still didn’t work and kept getting denied</p>
<p>So I looked into the file permissions and saw it was -rw-r--r--, which r means read and w means write. With these permissions, I wasn’t able to execute as the owner.</p>
<pre><code>almer@LAPTOP-OHBL0RFG:~$ chmod 700 private.key</code></pre>
<p>chmod allows us to change the permissions of the file (private.key). 700 means to change a certain section&#x27;s permission. The 7 means the owner section, and it also means to allow them to read, write, and execute. Neither of the 0’s doesn’t allow group and others to read, write, and execute.</p>
<pre><code>almer@LAPTOP-OHBL0RFG:~$ ssh bandit14@bandit.labs.overthewire.org -p 2220 -i private.key</code></pre>
<p>since I was able to change the permissions of the file. I decided to ssh bandit14 another time. -i means identifying which private key file to use when trying to connect to a host or server. But after I typed this command, I was able to get into bandit14 labs without a password.</p>`},

<p>After trying -ign_eof in the command, -ign_eof tells OpenSSL to ignore the end of files, but to keep the TLS connection. But after putting in the current level’s password, I was able to get the private key, and then I remembered what to do from level 14</p>
<pre><code>bandit16@bandit:~$ exit
almer@LAPTOP-OHBL0RFG:~$  echo &#x27;[RSA private key omitted — you get your own copy when you run this level]&#x27; &gt; private.key</code></pre>
<p>So after getting the private I exited from the bandit host, and I echoed the private key and redirected it into a new file.</p>
<pre><code>almer@LAPTOP-OHBL0RFG:~$ chmod 700 private.key
almer@LAPTOP-OHBL0RFG:~$ ssh bandit17@bandit.labs.overthewire.org -p 2220 -i private.key</code></pre>
<p>Then ssh into the next bandit level by -i, which identifies the private key, and I was able to get in.</p>`},
  {id:"17-18", label:"Bandit 17-18", cmd:"ls", body:`<pre><code>ls
passwords.new  passwords.old
cat passswords.new
cat passwords.old</code></pre>
<p>So I ls to see what files were in the directory and then I decided to see what’s inside the files. There was a list of passwords in those files.</p>
<pre><code>diff passwords.new passwords.old 
42c42
&lt; x2gLTTjFwMOhQ8oWNbMN362QKxfRqGlO
---
&gt; BMIOFKM7CRSLI97voLp3TD80NAq5exxk</code></pre>
<p>diff is used to show what’s different between those two files, and it shows that the top passwords were different in the <a href="http://passwords.new" target="_blank" rel="noopener">passwords.new</a> file. While at the bottom, passwords show what was different in the passwords.old file. So our password is <code>x2gLTTjFwMOhQ8oWNbMN362QKxfRqGlO</code> since it says the next level’s password is in the passwords.new file</p>`},
  {id:"18-19", label:"Bandit 18-19", cmd:"ssh bandit18@bandit.labs.overthewire.org -p 2220", body:`<pre><code>ssh bandit18@bandit.labs.overthewire.org -p 2220
Welcome to OverTheWire!

If you find any problems, please report them to the #wargames channel on
discord or IRC.

--[ Playing the games ]--

  This machine might hold several wargames.
  If you are playing &quot;somegame&quot;, then:

    * USERNAMES are somegame0, somegame1, ...
    * Most LEVELS are stored in /somegame/.
    * PASSWORDS for each level are stored in /etc/somegame_pass/.

  Write-access to homedirectories is disabled. It is advised to create a
  working directory with a hard-to-guess name in /tmp/.  You can use the
  command &quot;mktemp -d&quot; in order to generate a random and hard to guess
  directory in /tmp/.  Read-access to both /tmp/ is disabled and to /proc
  restricted so that users cannot snoop on eachother. Files and directories
  with easily guessable or short names will be periodically deleted! The /tmp
  directory is regularly wiped.
  Please play nice:

    * don&#x27;t leave orphan processes running
    * don&#x27;t leave exploit-files laying around
    * don&#x27;t annoy other players
    * don&#x27;t post passwords or spoilers
    * again, DONT POST SPOILERS!
      This includes writeups of your solution on your blog or website!

--[ Tips ]--

  This machine has a 64bit processor and many security-features enabled
  by default, although ASLR has been switched off.  The following
  compiler flags might be interesting:

    -m32                    compile for 32bit
    -fno-stack-protector    disable ProPolice
    -Wl,-z,norelro          disable relro

  In addition, the execstack tool can be used to flag the stack as
  executable on ELF binaries.

  Finally, network-access is limited for most levels by a local
  firewall.

--[ Tools ]--

 For your convenience we have installed a few useful tools which you can find
 in the following locations:

    * gef (https://github.com/hugsy/gef) in /opt/gef/
    * pwndbg (https://github.com/pwndbg/pwndbg) in /opt/pwndbg/
    * gdbinit (https://github.com/gdbinit/Gdbinit) in /opt/gdbinit/
    * pwntools (https://github.com/Gallopsled/pwntools)
    * radare2 (http://www.radare.org/)

--[ More information ]--

  For more information regarding individual wargames, visit
  http://www.overthewire.org/wargames/

  For support, questions or comments, contact us on discord or IRC.

  Enjoy your stay!

Byebye !
Connection to bandit.labs.overthewire.org closed.</code></pre>
<p>Once I tried to ssh into Bandit level 18, and once I tried putting in the password, it said Connection closed. But the next level password is stored in a file called readme, and the reason we’re getting kicked out is because .bashrc was modified to log us out.</p>
<pre><code>ssh bandit18@bandit.labs.overthewire.org -p 2220 cat readme</code></pre>
<p>So we did it like this because with SSH, you could end ssh with another command. If the command is specified, then it will be done on the remote host instead of logging into the shell. Then we have to use cat to see what’s inside the readme file:</p>
<p>after entering the bandit18 level password. It gave me bandit 19’s level password: <code>cGWpMaKXVwDUNgPAVJbWYuGHVn9zl3j8</code></p>`},
  {id:"19-20", label:"Bandit 19-20", cmd:"ls", body:`<pre><code>ls
bandit20-do
file bandit20-do
bandit20-do: setuid ELF 32-bit LSB executable, Intel 80386, version 1 (SYSV), dynamically linked, interpreter /lib/ld-linux.so.2, BuildID[sha1]=38f1351d0068ccbbace0e437f34859de85e63025, for GNU/Linux 3.2.0, not stripped</code></pre>
<p>I decided to ls the directory to see what files or directories we have. The only one that shows up is bandit20-do. I wanted to see what type of file bandit20-do is, and it is a setuid fil,e which means set user id. Setuid is basically a file permission that lets users use the root permissions instead of the user executing only within that file</p>
<pre><code>./bandit20-do whoami
bandit20</code></pre>
<p>Then ./ is the current directory, and we wanted to see the owner of the bandit20-do file, so that’s why we use whoami. We see that the owner is bandit20</p>
<pre><code>./bandit20-do cat /etc/bandit_pass/bandit20</code></pre>
<p>So we go from the current directory to the bandit20-do file because the owner is bandit20, and we need the owner to get access into the bandit20 file. Then I cat into the pathway to get the password for bandit level 20, which is why I did /etc/bandit_pass/bandit20. Since we were the owners of bandit20, we were allowed in the bandit20 file.</p>
<p>So the password was: <code>0qXahG8ZjOVMN9Ghs7iOWsCfZyXOUbYO</code></p>`},
  {id:"20-21", label:"Bandit 20-21", cmd:"ls", body:`<pre><code>ls 
suconnect
./suconnect (port number)</code></pre>
<p>So we have a file called suconnect and with suconnect you have to add any port number at the end. Then we need a second terminal for the port number to connect to and listen to as well.</p>
<pre><code>nc -lvp 10000
Listening on 0.0.0.0 10000
Connection received on localhost 41108</code></pre>
<p>I decided to the netcat because it allows two terminals talk to each other over ports. -l means listen, -v means to get some more information, -p means to go to the port we’re trying to listen to. You could choose any port number so I wanted to choose 10000</p>
<p>Then we see on the second terminal that were listening to the port 10000 and that the first terminal received our connection on local on port 41108</p>
<pre><code>Listening on 0.0.0.0 9999
Connection received on localhost 41108
0qXahG8ZjOVMN9Ghs7iOWsCfZyXOUbYO
EeoULMCra2q0dSkYj561DX7s1CpBuOBt</code></pre>
<p>After putting in the current level’s password in the second terminal we recieve the next level’s password</p>
<pre><code>Read: 0qXahG8ZjOVMN9Ghs7iOWsCfZyXOUbYO
Password matches, sending next password</code></pre>
<p>In our first terminal we saw that read our password from the second terminal showing that it actually connected. It also say that the password matches so that means our password is correct. Then we were able to get the next password for the next level: <code>EeoULMCra2q0dSkYj561DX7s1CpBuOBt</code></p>`},
  {id:"21-22", label:"Bandit 21-22", cmd:"cd /etc/cron.d", body:`<pre><code>cd /etc/cron.d
ls
behemoth4_cleanup  cronjob_bandit22  cronjob_bandit24  leviathan5_cleanup    otw-tmp-dir
clean_tmp          cronjob_bandit23  e2scrub_all       manpage3_resetpw_job  sysstat</code></pre>
<p>In this level, we have to learn about cron. Cron is basically a schedule task like let’s say I want to schedule a certain task at a certain tim,e that’s when I would use cron.</p>
<p>I had to change the directory because it told me that I had to look for the configuration inside it</p>
<p>After I cd the directory the ls to see what’s inside, we have a bunch of different files and directory.</p>
<pre><code>cat cronjob_bandit22
@reboot bandit22 /usr/bin/cronjob_bandit22.sh &amp;&gt; /dev/null
* * * * * bandit22 /usr/bin/cronjob_bandit22.sh &amp;&gt; /dev/null</code></pre>
<p>Once I cat cronjob_bandit22, it shows that at reboot, the root user bandit22 is running /usr/bin/cronjob_bandit22.sh, and the output it is giving is /dev/null.</p>
<p>The ***** represents the cron scheduling, like the minute, hour, day, month, and day of week</p>
<pre><code>cat  /usr/bin/cronjob_bandit22.sh
#!/bin/bash
chmod 644 /tmp/t7O6lds9S0RqQh9aMcz6ShpAoZKF7fgv
cat /etc/bandit_pass/bandit22 &gt; /tmp/t7O6lds9S0RqQh9aMcz6ShpAoZKF7fgv</code></pre>
<p>So I wanted to see what bandit22 was running, so I decided to cat the pathway it was running. What I saw is that it’s using bash with a chmod 644, which means owners read and write, users read, group read in a pathway of /tmp/<code>t7O6lds9S0RqQh9aMcz6ShpAoZKF7fgv</code></p>
<p>Then we also see that the /etc/bandit_pass/bandit2 is being redirected to /tmp/<code>t7O6lds9S0RqQh9aMcz6ShpAoZKF7fgv</code>, and normally the password is usually held in /etc/bandit_pass/bandit22</p>
<pre><code>cat  /tmp/t7O6lds9S0RqQh9aMcz6ShpAoZKF7fgv
tRae0UfB9v0UzbCdn9cY0gQnds9GF58Q</code></pre>
<p>After cat to see what&#x27;s inside that file, I was able to get next level’s password: <code>tRae0UfB9v0UzbCdn9cY0gQnds9GF58Q</code></p>`},
  {id:"22-23", label:"Bandit 22-23", cmd:"cd /etc/cron.d", body:`<pre><code>cd /etc/cron.d
ls
behemoth4_cleanup  cronjob_bandit22  cronjob_bandit24  leviathan5_cleanup    otw-tmp-dir
clean_tmp          cronjob_bandit23  e2scrub_all       manpage3_resetpw_job  sysstat</code></pre>
<p>I cd to change the directory to cron.d because again we are still looking at this directory then I wanted to see what’s inside the directory, and I see there are different file to see and one directory but it’s pointless.</p>
<pre><code>cat cronjob_bandit23
@reboot bandit23 /usr/bin/cronjob_bandit23.sh  &amp;&gt; /dev/null
* * * * * bandit23 /usr/bin/cronjob_bandit23.sh  &amp;&gt; /dev/null</code></pre>
<p>I wanted to see what’s inside the cronjob_bandit23 file, and all I got was that at the reboot the root user bandit23 runs cronjob_bandit23.sh, then the output is /dev/null.</p>
<p>Again with *****, which is the minute, hour, day, month, and day of week for the root user and running the file cronjob_bandit23.sh</p>
<pre><code>cat  /usr/bin/cronjob_bandit23.sh
#!/bin/bash

myname=$(whoami)
mytarget=$(echo I am user $myname | md5sum | cut -d &#x27; &#x27; -f 1)

echo &quot;Copying passwordfile /etc/bandit_pass/$myname to /tmp/$mytarget&quot;

cat /etc/bandit_pass/$myname &gt; /tmp/$mytarget</code></pre>
<p>Once I saw what’s inside the /usr/bin/cronjob_bandit23.sh. We see that it’s using bash. Also there is a shell script in it.</p>
<p>To get the name of the file, you would have to type whoami, and it would be the user but this time we could assume it’s bandit23 because that’s the user were trying to get the password from. To get your mytarget, you need to type out the command echo I am user $myname | md5sum | cut -d &#x27; &#x27; -f 1.</p>
<p>echo means print out text</p>
<p>You get $myname from whoami</p>
<p>md5sum is a text that turns into fixed length hash</p>
<p>cut means cut out columns, -d means delimiter bascially a separator for columns, ‘ ‘ is just a space, -f field number, and 1</p>
<p>After running that command I was able to get the md5 hash of bandit23, which was <code>8ca319486bfbbc3663ea0fbe81326349</code></p>
<pre><code>echo &quot;Copying passwordfile /etc/bandit_pass/bandit23 to /tmp/8ca319486bfbbc3663ea0fbe81326349&quot;
Copying passwordfile /etc/bandit_pass/bandit23 to /tmp/8ca319486bfbbc3663ea0fbe81326349</code></pre>
<p>So I decided to echo to copy the password file from /etc/bandit_pass/bandit23 to /tmp/<code>8ca319486bfbbc3663ea0fbe81326349</code></p>
<pre><code>cat /tmp/8ca319486bfbbc3663ea0fbe81326349</code></pre>
<p>The only thing left to do is to cat the file where the bandit23 password got copied to so after I did that, I was able to get bandit23 password, which was: <code>0Zf11ioIjMVN551jX3CmStKLYqjk54Ga</code></p>`}

    excerpt:"A deliberately vulnerable server left open to the internet for two hours, and what the logs showed: mostly Europe and the US East Coast, mostly root with no password, mostly port 22.",
    body:`
<p>A honeypot is a fake vulnerable network to trick attackers, so we are able to analyze their behavior, including how they attack and where they attack. The reason I wanted to build a honeypot is to deepen my skills and learn how attackers behave, as well as where most attackers originate from.</p>

<h3>What I used</h3>
<ul>
  <li><b>VirtualBox</b> — 4096 MB memory, 4 CPU, Kali ISO</li>
  <li><b>DigitalOcean</b> — Ubuntu 24.04 LTS x64, basic CPU, 8 GB memory, 4 CPU</li>
  <li><b>T-Pot</b> — the Telekom Security repository</li>
</ul>

<h3>Creating the droplet</h3>
<figure><img src="https://github.com/user-attachments/assets/88e4285e-6ce6-4e11-b49c-38402c73090c" alt="Choosing the San Francisco region in DigitalOcean" loading="lazy"><figcaption>Choosing the San Francisco region in DigitalOcean</figcaption></figure>
<p>I decided to use DigitalOcean as my cloud provider because I wanted to do something a little different, since everyone does an AWS EC2 honeypot. In DigitalOcean, I created a droplet, then I chose San Francisco because I wanted to see how many attackers attack in my region.</p>
<figure><img src="https://github.com/user-attachments/assets/c7d152c7-cc0d-4a75-bae7-44d071a0186d" alt="Selecting the Ubuntu 24.04 LTS image" loading="lazy"><figcaption>Selecting the Ubuntu 24.04 LTS image</figcaption></figure>
<p>The next step is choosing the image for the honeypot. I decided to go with Ubuntu 24.04 LTS x64 because I've seen that it is compatible with T-Pot, and I was already comfortable with Ubuntu. T-Pot will be important because we need it for our dashboard to analyze the attackers' behavior and location.</p>
<p>After deciding on the image, we have to choose the size — and for the honeypot, it takes up a lot of space. The minimum needed memory is 8 GB. Hence the reason I chose 8 GB and 4 CPUs. The CPU options don't matter; any option would work.</p>
<figure><img src="https://github.com/user-attachments/assets/dd000826-06f7-4e23-a1f0-9efda6749330" alt="Picking password authentication over SSH keys" loading="lazy"><figcaption>Picking password authentication over SSH keys</figcaption></figure>
<p>Next, I had to choose an authentication method. I decided to go with the password method because I've already done the SSH key method, and the password method is faster. With SSH keys you would have to download the key to your file and then <code>chmod</code> it so that it is only readable. Once I finished choosing the password method, I was ready to create the droplet.</p>
<figure><img src="https://github.com/user-attachments/assets/b2a2328c-2b6c-4b40-8d6a-f07b7c1830ae" alt="The droplet once it finished provisioning" loading="lazy"><figcaption>The droplet once it finished provisioning</figcaption></figure>
<p>This is what it looks like after I created my droplet. We are given the IPv4, which is the public IP. This will be important because we will need to SSH into this address, and this is where we will be accessing T-Pot later on. We are also given the private IP for the cloud that is being used.</p>

<h3>Connecting and installing T-Pot</h3>
<figure><img src="https://github.com/user-attachments/assets/9aaf1184-f865-4599-b010-a0b4e98b5b9a" alt="SSH'd into the droplet as root" loading="lazy"><figcaption>SSH'd into the droplet as root</figcaption></figure>
<p>Inside VirtualBox, I went to the terminal, and before I even started I ran <code>ip a</code> to make sure my <code>eth0</code> reaches the network and shows an IP address like <code>10.XX.XX.XX</code>. Sometimes I wouldn't be able to reach the network, so I would have to disconnect the wired connection, reconnect it, then test <code>ip a</code> again. Eventually I would see an IP address under <code>eth0</code>. I SSH into <code>root@IP-Address</code> to remote into the server. I successfully got into the server — you can see <code>root@HoneyPot</code> at the bottom.</p>
<figure><img src="https://github.com/user-attachments/assets/dac8888a-266d-41fc-b316-074207c950ca" alt="Adding a non-root user and cloning the T-Pot repository" loading="lazy"><figcaption>Adding a non-root user and cloning the T-Pot repository</figcaption></figure>
<p>Before adding the user, I ran:</p>
<pre><code>apt-get update &amp;&amp; apt-get upgrade -y</code></pre>
<p>This will update the server and upgrade any tools or repositories.</p>
<p>The reason I decided to add a user is that I need a non-root user to run the honeypot on. Running the honeypot as root can lead to compromised information. Then I had to set the password for <code>almer</code>. The password will be very important later on. The other values don't matter — you can leave them blank, because the honeypot doesn't use them.</p>
<p><code>almer</code> has the least privileges, which is why I ran:</p>
<pre><code>sudo usermod -aG sudo almer
su almer
cd /home/almer
sudo apt install git
git clone https://github.com/telekom-security/tpotce
cd tpotce
./install.sh</code></pre>
<p><code>usermod -aG sudo</code> gives almer sudo privileges, which is like root or admin privileges. Then I switched user with <code>su almer</code>, which is why you see <code>almer@HoneyPot</code>. I moved to the home directory, made sure git was installed because the next command needs it, then cloned the T-Pot repository. When it finished cloning I changed into <code>tpotce</code>, where there are several directories and files — but the only one we need is <code>install.sh</code>.</p>
<p>During the middle of the installation, it will show that the SSH port is now <code>64295</code>. It will also ask what installation type you want. I chose <b>h</b>, which is hive, because it is the standard T-Pot. The others are S (sensor), L (LLM), I (mini), M (mobile) and T (tarpit). Near the end, it asks you to set a web username and password, which will be important later as well.</p>
<figure><img src="https://github.com/user-attachments/assets/79abe2f7-785c-44ac-8b9b-9c79ae82a2b3" alt="Active connections at the end of the install, showing port 64295" loading="lazy"><figcaption>Active connections at the end of the install, showing port 64295</figcaption></figure>
<p>At the end of the installation, it shows us the active internet connections. I see that 64295 is active, which is the new port to SSH into. Then it asks us to reboot. Once we reboot, it kicks us back to our machine.</p>
<figure><img src="https://github.com/user-attachments/assets/e001f1b1-3dab-4ebe-8f2f-0afcc2750251" alt="Reconnecting on the new SSH port" loading="lazy"><figcaption>Reconnecting on the new SSH port</figcaption></figure>
<p>I have to SSH into the new port because the old port (22) doesn't work anymore:</p>
<pre><code>ssh -p 64295 root@IP-Address</code></pre>
<p>I was able to connect to the root server. <code>-p</code> means port. After this, everything should work.</p>
<figure><img src="https://github.com/user-attachments/assets/5d233de3-7e78-4a32-a30d-c0766af74106" alt="The T-Pot dashboard on port 64297" loading="lazy"><figcaption>The T-Pot dashboard on port 64297</figcaption></figure>
<p>Inside the browser of VirtualBox, I put <code>https://Public-IP:64297</code>. 64297 is the listening port, which I found through the telekom-security GitHub repository. The reason I did it inside VirtualBox is that when I tried to access the site from my laptop it said "unsecure" — which we expect — but it wouldn't let me advance past the warning. So I tried Firefox inside my VirtualBox and was finally able to advance. When loading, it asks for the username and password you set during the T-Pot setup.</p>

<h3>Results</h3>
<p>I let my honeypot run for less than 2 hours, and during that time I was able to get these results.</p>
<figure><img src="https://github.com/user-attachments/assets/84ebec27-498c-41c1-868a-9314ffa6463a" alt="Attack map and event totals" loading="lazy"><figcaption>Attack map and event totals</figcaption></figure>
<figure><img src="https://github.com/user-attachments/assets/9a19e497-247c-4914-9b73-bacc7e59b0e5" alt="Most-attempted usernames and passwords" loading="lazy"><figcaption>Most-attempted usernames and passwords</figcaption></figure>
<figure><img src="https://github.com/user-attachments/assets/b8b2cede-5dda-40c6-a04d-9adcb1be2952" alt="Most-targeted ports" loading="lazy"><figcaption>Most-targeted ports</figcaption></figure>
<p>I was able to see that the attackers are mostly coming from Europe and the East Coast of America. Attackers are mostly trying <code>root</code> for the username and nothing for the password. To me it is really interesting how basic the usernames and passwords they're trying are. I could also see which port they're attacking, which in this case is mostly port 22.</p>

<h3>Conclusion</h3>
<p>This was a very fun project to build, and I definitely learned a lot while I was building it. I ran into a couple of challenges, including troubleshooting my connection, missing Docker containers at times, and T-Pot not working. But in reality, this is what the IT and cyber security field is all about: running into an error, stressing about it, then figuring out a way to fix it and make it work.</p>
<p>I am glad that I was able to fix my mistakes and finish this project. I learned a lot about blue team concepts, hands-on troubleshooting, Linux, the attacker mindset, cloud infrastructure, and networking.</p>
<p><a href="https://github.com/AlmerGaringan/HoneyPot" target="_blank" rel="noopener">Repository on GitHub</a></p>

    excerpt:"My first project - a Raspberry Pi filtering DNS for every device on the network. 96 out of 100 on the AdBlock tester, and a crash course in DHCP, static IPs, and LAN addressing.",
    body:`
<p>A Pi-hole is a network-wide ad blocker and a DNS filter. The reason I decided to build a Pi-Hole is to block the ads that are in my network. I learned a lot through this project; some of the key concepts I acquired include DNS, Linux, and IP addressing.</p>
<figure><img src="https://github.com/user-attachments/assets/3fd9718b-fb90-4151-bc03-e505554d7202" alt="The Pi-hole admin dashboard" loading="lazy"><figcaption>The Pi-hole admin dashboard</figcaption></figure>

<h3>Hardware and OS</h3>
<ul>
  <li>Travel router</li>
  <li>Wireless ethernet adapter</li>
  <li>Raspberry Pi OS and Ubuntu Server</li>
</ul>

<h3>Installation</h3>
<p>The first command when I was building this project was:</p>
<pre><code>sudo apt update
sudo apt full-upgrade</code></pre>
<p>The first thing I did was update and fully upgrade my system. This allows your Pi packages to be fully updated to make sure they're up to date.</p>
<p>Then I ran this command:</p>
<pre><code>curl -sSL https://install.pi.hole.net | bash</code></pre>
<p><code>curl</code> is used to fetch or retrieve the data in that URL or from the server. In <code>-sSL</code>, <code>-s</code> means silent mode, <code>-S</code> only shows errors, and <code>-L</code> follows any redirection.</p>
<p>Bash receives what the curl command wants to fetch, then turns that input into text and runs the script line by line.</p>
<p>After you type this command in, an installation wizard will pop up. This will allow you to customize your Pi-hole.</p>
<p>In your router interface, you want to go to your DNS server settings and manually type out your Pi-hole IP address. A way to find out your IP address is by completing your installation, which gives you your IP address shown as <code>IPV4: (IP Address)</code>.</p>
<figure><img src="https://github.com/user-attachments/assets/79398870-9ecb-4e79-8242-1022c46025d0" alt="Pointing the router's DNS settings at the Pi-hole" loading="lazy"><figcaption>Pointing the router's DNS settings at the Pi-hole</figcaption></figure>
<p>Another way of finding out your Pi-hole IP address is through the CLI:</p>
<pre><code>ip addr</code></pre>
<p>This will give you all of the IP addresses on your Pi. So whatever interface you choose during the installation, whether it's <code>wlan0</code> or <code>eth0</code> or some other one, the IP address will be under whatever you choose.</p>
<p>After this, I enabled my DHCP settings in my Pi-hole admin. In this, you will get a range of IP addresses to hand out from start to end, then you also have to put your router IP address, and lastly your netmask. I was able to find all of this through my travel router. In the LAN private network, I was given the start and end IP address, the netmask, and the router IP address. So I added my LAN private network into my Pi-hole DHCP server settings.</p>
<p>Lastly, I needed to add my Pi-Hole as a client in my travel router, so I had to add my Pi to my LAN private network by putting in my Pi-Hole IPv4 address and also the static IPv6 address of my Pi-Hole. But then I realized that my WiFi connection from my travel router is different from my main router, so when I connected my devices to my travel router's WiFi, I was finally able to see my Pi-Hole work with all of my devices across my network.</p>

<h3>Results</h3>
<p>Seeing my score being a 96 out of 100 from an AdBlock tester shows that my Pi-hole works and blocks out adware, spyware, and malware queries on my network.</p>
<figure><img src="https://github.com/user-attachments/assets/f348bc2f-dc0c-48d4-b66a-aa1b56d0ea47" alt="96 out of 100 on the AdBlock tester" loading="lazy"><figcaption>96 out of 100 on the AdBlock tester</figcaption></figure>
<p>These are my results after 2 hours of my Pi-hole working. I noticed that there were no more pop-up ads on sites that I would visit, and I also noticed my browsing speed has gotten faster.</p>
<figure><img src="https://github.com/user-attachments/assets/63d8625d-da33-4682-bc92-5cc317a1b70f" alt="Query stats after two hours" loading="lazy"><figcaption>Query stats after two hours</figcaption></figure>

<h3>Key takeaways</h3>
<p>Key takeaways I took from my first project were to strengthen my Linux skills and also learning about static IP, DNS, LAN, DHCP, and IP addresses. I was also able to gain hands-on experience and learn throughout this project about network security and privacy, understanding how a Pi-hole can reduce the amount of spyware, adware, and malware queries that are happening on my network.</p>
<p>I was finally able to deepen my skills and knowledge on how IP addresses, LAN, DHCP, DNS, and malicious or unwanted queries play an important role in the IT and cyber security industry.</p>
<p><a href="https://github.com/AlmerGaringan/Pi-Hole" target="_blank" rel="noopener">Repository on GitHub</a></p>

function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function tile(colors, seed, size=16){
  const c=document.createElement("canvas"); c.width=c.height=size;
  const x=c.getContext("2d"), r=rng(seed);
  for(let i=0;i<size;i++) for(let j=0;j<size;j++){ x.fillStyle=colors[Math.floor(r()*colors.length)]; x.fillRect(i,j,1,1); }
  return `url(${c.toDataURL()})`;
}

/* ============================================================ panorama */
/* A blocky landscape lit like a shader pack: golden-hour sun, distance fog,
   slope lighting, tree shadows, sun rays and bloom. Everything is drawn here,
   no image files. Layers are periodic so they scroll forever. */
const World = (function(){
  const cv = document.getElementById("world"), ctx = cv.getContext("2d");
  let bs=4, cols=0, rows=0, layers=[], sky=null, night = store.get("almer.time","day")==="night";
  let sun = {x:0,y:0,s:8}, last=0, start=performance.now(), running=true;

  const C = hex=>[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
  const mix = (a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
  const hash=(a,b,s)=>{ let h=Math.imul(a*374761393 + b*668265263 + s*982451653, 1274126177); h^=h>>>13; h=Math.imul(h,1274126177); return ((h^h>>>16)>>>0)/4294967296; };
  function periodic(P, seed, amps){
    const r=rng(seed), parts=amps.map(([f,a])=>({f,a,ph:r()*Math.PI*2}));
    return x=>parts.reduce((s,p)=>s+p.a*Math.sin(2*Math.PI*p.f*x/P+p.ph),0);
  }

  /* palette for the time of day */
  function pal(){
    return night ? {
      top:C("#03060F"), mid:C("#0B1430"), hor:C("#1E2B52"), glow:C("#3A4C80"),
      fog:C("#1A2546"), light:C("#9FB4E8"), lightAmt:.10, dark:.42, shadow:.55,
      cloudTop:C("#4A5878"), cloudBot:C("#26304A"), cloudA:150
    } : {
      top:C("#2F5FB8"), mid:C("#7FA8E6"), hor:C("#F7C796"), glow:C("#FFA45C"),
      fog:C("#E9B98E"), light:C("#FFD08A"), lightAmt:.28, dark:1, shadow:.62,
      cloudTop:C("#FFF4E4"), cloudBot:C("#F0A88C"), cloudA:240
    };
  }

  function layerCanvas(P,H){ const c=document.createElement("canvas"); c.width=P; c.height=H; return c; }
  function painter(c, fogAmt){
    const x=c.getContext("2d"), img=x.createImageData(c.width,c.height), d=img.data, W=c.width, H=c.height, p=pal();
    return {
      set(px,py,rgb,a=255,v=0){
        if(py<0||py>=H) return; px=((px%W)+W)%W; const i=(py*W+px)*4;
        let col = rgb.map(c=>c*(1+v)*p.dark);
        col = mix(col, p.fog, fogAmt);
        d[i]=Math.min(255,Math.max(0,col[0])); d[i+1]=Math.min(255,Math.max(0,col[1])); d[i+2]=Math.min(255,Math.max(0,col[2])); d[i+3]=a;
      },
      mul(px,py,k){
        if(py<0||py>=H) return; px=((px%W)+W)%W; const i=(py*W+px)*4;
        if(!d[i+3]) return; d[i]*=k; d[i+1]*=k; d[i+2]*=k;
      },
      done(){ x.putImageData(img,0,0); }
    };
  }

  function buildSky(){
    const p=pal();
    sky = layerCanvas(cols, rows);
    const x=sky.getContext("2d");
    const g=x.createLinearGradient(0,0,0,rows);
    g.addColorStop(0, `rgb(${p.top})`);
    g.addColorStop(.36, `rgb(${p.mid})`);
    g.addColorStop(.56, `rgb(${p.hor})`);
    g.addColorStop(.66, `rgb(${p.glow})`);
    g.addColorStop(1, `rgb(${p.glow})`);
    x.fillStyle=g; x.fillRect(0,0,cols,rows);
    sun = {x:Math.round(cols*0.70), y:Math.round(rows*(night?0.16:0.40)), s:Math.max(6,Math.round(rows*0.05))};
    if(night){
      const r=rng(99);
      for(let i=0;i<cols*rows*0.004;i++){ x.fillStyle=r()<.2?"#fff4c8":"#d8e2ff"; x.globalAlpha=.4+r()*.6; x.fillRect(Math.floor(r()*cols),Math.floor(r()*rows*0.55),1,1); }
      x.globalAlpha=1;
      x.fillStyle="#E6EBF5"; x.fillRect(sun.x,sun.y,sun.s,sun.s);
      x.fillStyle="#C2C9D8"; x.fillRect(sun.x+2,sun.y+2,2,2); x.fillRect(sun.x+sun.s-4,sun.y+sun.s-3,2,1);
    }else{
      x.fillStyle="#FFF6D6"; x.fillRect(sun.x,sun.y,sun.s,sun.s);
    }
  }

  function buildClouds(P){
    const p=pal(), H=rows, c=layerCanvas(P,H), pt=painter(c,0), r=rng(5);
    const n=Math.round(P/34);
    for(let i=0;i<n;i++){
      const cx=Math.floor(r()*P), cy=Math.floor(H*(0.05+r()*0.24)), w=12+Math.floor(r()*30), h=3+Math.floor(r()*3);
      for(let bx=0;bx<w;bx++) for(let by=0;by<h;by++){
        if(by===0 && (bx<2||bx>w-3) && r()<.6) continue;
        const t = h>1 ? by/(h-1) : 0;
        pt.set(cx+bx, cy+by, mix(p.cloudTop,p.cloudBot,t*.85), p.cloudA, (hash(cx+bx,by,3)-.5)*.04);
      }
      if(r()<.6){ const ox=2+Math.floor(r()*(w-8)), ow=4+Math.floor(r()*6);
        for(let bx=0;bx<ow;bx++) pt.set(cx+ox+bx, cy-1, p.cloudTop, p.cloudA); }
    }
    pt.done(); return c;
  }

  function buildMountains(P){
    const p=pal(), H=rows, c=layerCanvas(P,H), pt=painter(c, night?.35:.42);
    const f=periodic(P, 11, [[2,.5],[5,.28],[11,.14],[23,.06]]);
    const base=H*0.53, amp=H*0.15;
    const rock=C("#5E6E8C"), rock2=C("#6E7E9C"), snow=C("#EEF2F8"), snowLit=mix(C("#FFE6D0"),p.light,.3);
    const tops=[]; for(let x=0;x<P;x++) tops[x]=Math.round(base - amp*f(x));
    for(let x=0;x<P;x++){
      const top=tops[x], slope=tops[(x+1)%P]-tops[(x-1+P)%P]; /* <0: rising to the right, faces away from the sun */
      const lit = slope>0 ? .12 : slope<0 ? -.14 : 0;
      for(let y=top;y<H;y++){
        const depth=y-top, v=(hash(x,y,4)-.5)*.06 + lit*Math.max(0,1-depth/30);
        let col = (top<H*0.44 && depth<3) ? (slope>=0 ? snowLit : snow) : (depth%7===0 && hash(x,y,9)<.4) ? rock2 : rock;
        pt.set(x,y,col,255,v - Math.min(depth,60)*.002);
      }
    }
    pt.done(); return c;
  }

  function terrain(P, seed, base, amp, opts){
    const p=pal(), H=rows, c=layerCanvas(P,H), pt=painter(c, opts.fog), r=rng(seed);
    const f=periodic(P, seed, opts.waves);
    const grass=C(opts.grass), grass2=C(opts.grass2), dirt=C(opts.dirt), dirt2=C(opts.dirt2),
          water=C(night?"#1E3A78":"#3A6CC8"), waterLit=mix(C("#5A8AE0"),p.light,.45), sand=C("#DCCB8C");
    const tops=[]; for(let x=0;x<P;x++) tops[x]=Math.round(base - amp*f(x));
    const sea = opts.sea ? Math.round(base + amp*0.18) : 1e9;
    for(let x=0;x<P;x++){
      const t=tops[x], slope=tops[(x+1)%P]-tops[(x-1+P)%P];
      const lit = slope>0 ? .16 : slope<0 ? -.18 : .02;
      for(let y=Math.min(t,sea);y<H;y++){
        const v=(hash(x,y,seed)-.5)*.14;
        if(y<t){ /* water, brighter where it catches the sky */
          const surf = y-sea;
          const col = surf===0 ? waterLit : (hash(x,y,seed+1)<.12 && surf<4) ? mix(water,waterLit,.6) : water;
          pt.set(x,y,col,240,v*.3 - surf*.01); continue;
        }
        const depth=y-t;
        let col, shade = v - Math.min(depth,60)*opts.fade + lit*Math.max(0,1-depth/14);
        if(t>=sea-1 && depth<3) col=sand;
        else if(depth===0) { col = mix(grass2, p.light, slope>=0 ? p.lightAmt : p.lightAmt*.3); shade += .1; }
        else if(hash(x>>2,y>>1,seed+4)<.03) col = hash(x,y,seed+5)<.5 ? dirt : dirt2;
        else col = hash((x>>1),(y>>1),seed+2)<.35 ? grass2 : grass;
        pt.set(x,y,col,255,shade);
      }
    }
    /* trees, with a shadow cast away from the sun (to the left) */
    const trunk=C("#5A3C22"), leaf=C(opts.leaf), leaf2=C(opts.leaf2), leafLit=mix(C(opts.leaf2),p.light,.35);
    let x = 4 + Math.floor(r()*8);
    while(x < P-4){
      const t=tops[x];
      if(t < sea-1 && Math.abs(tops[x-1]-t)<=1 && Math.abs(tops[x+1]-t)<=1 && r()<opts.trees){
        const th = opts.trunk + Math.floor(r()*2), lw=opts.leafW;
        for(let dx=-lw*3-2; dx<=lw; dx++) for(let dy=0; dy<3; dy++)
          pt.mul(x+dx, tops[((x+dx)%P+P)%P]+dy, 1-(1-p.shadow)*(1-Math.abs(dx+lw)/(lw*3+4)));
        for(let y=1;y<=th;y++) pt.set(x,t-y,trunk,255,(hash(x,y,7)-.5)*.1 + (y%2?-.05:0));
        const ly=t-th-1;
        for(let dy=-3;dy<=1;dy++){
          const half = dy===-3 ? 1 : dy===1 ? lw-1 : lw;
          for(let dx=-half;dx<=half;dx++){
            if((dy===1||dy===-2) && Math.abs(dx)===half && hash(x+dx,dy,8)<.5) continue;
            const litSide = dx>0 && dy<=-1, under = dy>=0 || dx<-half+1;
            const col = litSide ? leafLit : hash(x+dx,ly+dy,seed+9)<.3 ? leaf2 : leaf;
            pt.set(x+dx, ly+dy, col, 255, (hash(x+dx,ly+dy,2)-.5)*.12 + (under?-.2:0));
          }
        }
        x += opts.gap + Math.floor(r()*opts.gap);
      } else x += 2;
    }
    if(opts.flowers){
      for(let x2=0;x2<P;x2++) if(tops[x2]<sea-1 && hash(x2,1,seed+11)<opts.flowers)
        pt.set(x2, tops[x2]-1, hash(x2,2,seed)<.5 ? C("#F2D04A") : C("#E2483C"));
    }
    pt.done(); return c;
  }

  function soften(c){ /* a touch of depth-of-field on far layers, where the browser supports it */
    try{
      const o=layerCanvas(c.width,c.height), x=o.getContext("2d");
      x.filter="blur(0.6px)"; x.drawImage(c,0,0);
      if(x.filter!=="blur(0.6px)") return c;
      return o;
    }catch(e){ return c; }
  }

  function build(){
    const vw=innerWidth, vh=innerHeight;
    bs = Math.max(3, Math.min(6, Math.round(Math.max(vw, vh*1.2)/300)));
    cols=Math.ceil(vw/bs)+1; rows=Math.ceil(vh/bs)+1;
    cv.width=cols*bs; cv.height=rows*bs;
    ctx.imageSmoothingEnabled=false;
    const P=n=>Math.max(n, cols+40);
    buildSky();
    layers=[
      {img:buildClouds(P(420)),            speed:.9},
      {img:soften(buildMountains(P(460))),   speed:.55, smooth:true},
      {img:terrain(P(520), 31, rows*0.70, rows*0.07,
        {waves:[[3,.5],[7,.3],[13,.15],[29,.05]], grass:"#5E9A42", grass2:"#6FAE4E", dirt:"#7A5634", dirt2:"#6B4A2B",
         leaf:"#356F26", leaf2:"#43852F", trees:.55, trunk:3, leafW:2, gap:9, sea:true, flowers:0, fade:.006, fog:night?.18:.24}), speed:1.6},
      {img:terrain(P(600), 57, rows*0.87, rows*0.06,
        {waves:[[2,.55],[5,.3],[17,.12]], grass:"#4E8A34", grass2:"#5C9C3E", dirt:"#6B4A2B", dirt2:"#5E4126",
         leaf:"#2A5E1E", leaf2:"#357026", trees:.6, trunk:5, leafW:3, gap:14, sea:false, flowers:.05, fade:.009, fog:night?.04:.05}), speed:3.2}
    ];
    draw(performance.now());
  }

  /* screen-space light: sun rays and bloom, drawn over the world */
  function light(t){
    const p=pal(), cx=(sun.x+sun.s/2)*bs, cy=(sun.y+sun.s/2)*bs, W=cols*bs, H=rows*bs;
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    const bloom=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*(night?.25:.45));
    bloom.addColorStop(0, night?"rgba(170,190,255,.22)":"rgba(255,214,150,.55)");
    bloom.addColorStop(.25, night?"rgba(120,140,220,.06)":"rgba(255,170,90,.18)");
    bloom.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle=bloom; ctx.fillRect(0,0,W,H);
    if(!night){
      const n=9;
      for(let i=0;i<n;i++){
        const a = Math.PI*(0.55 + i*0.075) + Math.sin(t*0.15+i)*0.01;
        const w = 0.018 + (i%3)*0.008, len=Math.hypot(W,H);
        const pulse = 0.05 + 0.035*Math.sin(t*0.4 + i*1.7);
        const g=ctx.createLinearGradient(cx,cy,cx+Math.cos(a)*len*.7,cy+Math.sin(a)*len*.7);
        g.addColorStop(0, `rgba(255,220,160,${pulse})`); g.addColorStop(1,"rgba(255,220,160,0)");
        ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(cx,cy);
        ctx.lineTo(cx+Math.cos(a-w)*len, cy+Math.sin(a-w)*len);
        ctx.lineTo(cx+Math.cos(a+w)*len, cy+Math.sin(a+w)*len);
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
    /* color grade: warm highlights, cool deep shadows at the bottom */
    const g2=ctx.createLinearGradient(0,0,0,H);
    g2.addColorStop(0, night?"rgba(10,20,60,.10)":"rgba(255,190,120,.06)");
    g2.addColorStop(1, night?"rgba(0,0,20,.35)":"rgba(20,30,60,.22)");
    ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);
  }

  function draw(now){
    const t=(now-start)/1000;
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(sky,0,0,cols*bs,rows*bs);
    for(const L of layers){
      const P=L.img.width, off = reduced ? 0 : (t*L.speed) % P;
      let x = -Math.round(off*bs);
      while(x < cols*bs){ ctx.drawImage(L.img, x, 0, P*bs, rows*bs); x += P*bs; }
    }
    light(reduced ? 0 : t);
  }
  function loop(now){
    if(running && !reduced && now-last > 33){ last=now; draw(now); }
    requestAnimationFrame(loop);
  }
  let rt; addEventListener("resize", ()=>{ clearTimeout(rt); rt=setTimeout(build,150); });
  document.addEventListener("visibilitychange", ()=>{ running = !document.hidden; });
  build(); requestAnimationFrame(loop);
  return {
    setNight(v){ night=v; store.set("almer.time", v?"night":"day"); build();
      document.querySelector('meta[name="theme-color"]').content = v ? "#03060F" : "#2F5FB8"; },
    isNight(){ return night; },
    redraw(){ draw(performance.now()); }
  };
})();

/* Background music: an original, generated ambient piano loop (no audio files).
   Browsers only allow sound after a click, so it starts on the first click
   once sound is on, and the sound button turns it off and on. */
const SONGS = [
  {name:"Golden Hour", beat:.62, wave:"triangle", lead:.5,
   chords:[[53,60,64,69],[57,60,64,67],[48,55,59,64],[55,59,62,64]], scale:[72,74,76,79,81,84,86,88]},
  {name:"Night Shift", beat:.82, wave:"sine", lead:.42,
   chords:[[45,52,55,60],[41,48,52,57],[38,45,48,53],[40,47,50,55]], scale:[69,72,74,76,79,81,84]},
  {name:"Packet Rain", beat:.44, wave:"triangle", lead:.6, arp:true,
   chords:[[50,57,61,66],[47,54,57,62],[43,50,54,59],[45,52,57,61]], scale:[74,76,78,81,83,86]},
  {name:"Homelab", beat:.7, wave:"sine", lead:.45, bass:true,
   chords:[[48,55,59,62],[52,55,59,64],[45,52,55,60],[41,48,52,57]], scale:[72,74,76,79,81,83,84]}
];
const Music = (function(){
  let ctx=null, out=null, master=null, timer=null, playing=false, step=0, chordIdx=0;
  let songIdx = Math.min(SONGS.length-1, Math.max(0, parseInt(store.get("almer.song","0"),10)||0));
  let volume = Math.min(1, Math.max(0, parseFloat(store.get("almer.volume","0.5"))));
  if(isNaN(volume)) volume = .5;
  const midi = n => 440*Math.pow(2,(n-69)/12);
  function reverb(){
    const len=ctx.sampleRate*3.2, buf=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){ const d=buf.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
    const cv=ctx.createConvolver(); cv.buffer=buf; return cv;
  }
  function note(n, t, dur, vol, wave){
    const o=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter(), g2=ctx.createGain();
    o.type=wave; o2.type="sine"; o.frequency.value=midi(n); o2.frequency.value=midi(n)*2.001;
    f.type="lowpass"; f.frequency.value=2200; g2.gain.value=0.25;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(f); o2.connect(g2).connect(f); f.connect(g).connect(out);
    o.start(t); o2.start(t); o.stop(t+dur+0.05); o2.stop(t+dur+0.05);
  }
  function tick(){
    if(!playing) return;
    const s=SONGS[songIdx], t=ctx.currentTime+0.05;
    const ch=s.chords[chordIdx%s.chords.length];
    if(step%8===0){
      ch.forEach((n,i)=>note(n, t+i*0.06, s.beat*9, 0.05, s.wave));
      if(s.bass) note(ch[0]-12, t, s.beat*7, 0.06, "sine");
      chordIdx++;
    }
    if(s.arp){ if(step%2===0) note(ch[(step/2)%ch.length]+12, t, s.beat*4, 0.03, s.wave); }
    if(Math.random() < (step%2 ? s.lead*.55 : s.lead)) note(s.scale[Math.floor(Math.random()*s.scale.length)], t, s.beat*5, 0.045, s.wave);
    step++;
    timer=setTimeout(tick, s.beat*1000);
  }
  function ensure(){
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==="suspended") ctx.resume();
    if(!out){
      master=ctx.createGain(); master.gain.value=volume*1.6;
      const dry=ctx.createGain(); dry.gain.value=0.55;
      const wet=ctx.createGain(); wet.gain.value=0.6;
      const rv=reverb();
      out=ctx.createGain();
      out.connect(dry).connect(master); out.connect(rv); rv.connect(wet).connect(master);
      master.connect(ctx.destination);
    }
  }
  return {
    start(){
      if(playing) return;
      try{
        ensure();
        out.gain.cancelScheduledValues(ctx.currentTime);
        out.gain.setValueAtTime(0.0001,ctx.currentTime); out.gain.exponentialRampToValueAtTime(1,ctx.currentTime+2);
        playing=true; step=0; chordIdx=0; tick();
      }catch(e){}
    },
    stop(){
      if(!playing) return; playing=false; clearTimeout(timer);
      try{ out.gain.cancelScheduledValues(ctx.currentTime); out.gain.setValueAtTime(out.gain.value||1,ctx.currentTime); out.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.8); }catch(e){}
    },
    next(){
      songIdx=(songIdx+1)%SONGS.length; store.set("almer.song", String(songIdx));
      if(playing){
        clearTimeout(timer); playing=false;
        try{ out.gain.cancelScheduledValues(ctx.currentTime); out.gain.setValueAtTime(out.gain.value||1,ctx.currentTime); out.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.4); }catch(e){}
        setTimeout(()=>this.start(), 450);
      }
      return SONGS[songIdx];
    },
    setVolume(v){
      volume=Math.min(1,Math.max(0,v)); store.set("almer.volume", String(volume));
      if(master) master.gain.setTargetAtTime(volume*1.6, ctx.currentTime, 0.05);
    },
    get volume(){ return volume; },
    get song(){ return SONGS[songIdx]; },
    get songNumber(){ return songIdx+1; },
    get playing(){ return playing; }
  };
})();

let optsReturn=null;
function syncSoundBtn(){
  const sb=document.getElementById("soundbtn"); if(!sb) return;
  sb.innerHTML=icon(soundOn?"sound":"mute");
  sb.setAttribute("aria-label", soundOn?"Turn music and sounds off":"Turn music and sounds on");

function setSound(on){ soundOn=on; store.set("almer.sound", on?"on":"off"); syncSoundBtn(); if(on){ Music.start(); } else Music.stop(); }
function openOpts(focusId){
  closeOpts(true);
  if(!optsReturn) optsReturn=document.activeElement;
  document.body.insertAdjacentHTML("beforeend", optsHTML());
  const w=document.getElementById("opts"), vol=document.getElementById("optvol");
  vol.addEventListener("input", ()=>{ Music.setVolume(vol.value/100); vol.style.setProperty("--p", vol.value+"%"); document.getElementById("optvolv").textContent=vol.value+"%"; });
  w.addEventListener("click", e=>{
    const id=(e.target.closest("button")||{}).id;
    if(e.target===w || id==="optdone"){ closeOpts(); return; }
    if(id==="optplay"){ setSound(!Music.playing); setTimeout(()=>openOpts("optplay"), 60); }
    if(id==="optnext"){ Music.next(); if(!Music.playing) setSound(true); setTimeout(()=>openOpts("optnext"), 60); }
    if(id==="optfull"||id==="optred"){
      reduced = id==="optred"; store.set("almer.motion", reduced?"reduced":"full");
      document.documentElement.classList.toggle("reduce", reduced); World.redraw(); openOpts(id);
    }
    if(id==="optday"||id==="optnight"){ World.setNight(id==="optnight"); openOpts(id); }
  });
  const f=document.getElementById(focusId||"optdone"); if(f) f.focus();
  document.documentElement.style.overflow="hidden";
}
function closeOpts(keep){
  const w=document.getElementById("opts"); if(!w) return;
  w.remove();
  if(!keep){ document.documentElement.style.overflow=""; if(optsReturn&&optsReturn.focus) optsReturn.focus(); optsReturn=null; }
}
document.addEventListener("keydown", e=>{
  const w=document.getElementById("opts"); if(!w) return;
  if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); closeOpts(); return; }
  if(e.key==="Tab"){
    const f=[...w.querySelectorAll("input,button")];
    if(e.shiftKey && document.activeElement===f[0]){ e.preventDefault(); f[f.length-1].focus(); }
    else if(!e.shiftKey && document.activeElement===f[f.length-1]){ e.preventDefault(); f[0].focus(); }
  }
}, true);

function bookHTML(){

      </div>
    </form>

    <div class="book-btns">
      <button type="button" class="btn" data-close><span class="lbl">Cancel</span></button>

    </div>
  </div>`;
