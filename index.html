let bookReturn = null;
function openBook(){
  closeBook();
  bookReturn = document.activeElement;
  document.body.insertAdjacentHTML("beforeend", bookHTML());
  document.documentElement.style.overflow="hidden";
  const wrap = document.getElementById("book"), form = document.getElementById("bookform"),
        msg = document.getElementById("bookmsg"), count = document.getElementById("bookcount"), status = document.getElementById("bookstatus");
  wrap.addEventListener("click", e=>{ if(e.target===wrap || e.target.closest("[data-close]")) closeBook(); });
  msg.addEventListener("input", ()=>{ count.textContent = msg.value.length; });
  form.addEventListener("submit", async e=>{
    e.preventDefault();
    const from = form.from.value.trim(), subject = form.subject.value.trim() || "Message from your website", text = msg.value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(from)){ status.textContent = "Please enter your email so I can reply."; form.from.focus(); return; }
    if(!text){ status.textContent = "Please write a message first."; msg.focus(); return; }

    if(WEB3FORMS_KEY){
      const send = wrap.querySelector('button[type=submit]');
      send.disabled = true; send.querySelector(".lbl").textContent = "Sending...";
      status.textContent = "";
      try{
        const r = await fetch("https://api.web3forms.com/submit", {
          method:"POST",
          headers:{"Content-Type":"application/json", Accept:"application/json"},
          body: JSON.stringify({ access_key: WEB3FORMS_KEY, subject: `Portfolio: ${subject}`, from_name: "Portfolio contact form",
                                 email: from, replyto: from, message: text })
        });
        const res = await r.json().catch(()=>({}));
        if(!r.ok || res.success === false) throw new Error(res.message || "Send failed");
        bookSent();
      }catch(err){
        send.disabled = false; send.querySelector(".lbl").textContent = "Sign & Send";
        status.innerHTML = `Sorry, that didn't go through. Please try again, or email me at <a href="mailto:${LINKS.email}">${LINKS.email}</a>.`;
      }
      return;
    }

    /* no key yet: hand the message to the visitor's email app */
    const body = `${text}\n\n— ${from}`;
    let copied = false;
    try{ await navigator.clipboard.writeText(`To: ${LINKS.email}\nSubject: ${subject}\n\n${body}`); copied = true; }catch(err){}
    window.location.href = `mailto:${LINKS.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    status.innerHTML = `Opening your email app with the message ready to send.` +
      (copied ? ` If nothing opened, it's copied: paste it into an email to <a href="mailto:${LINKS.email}">${LINKS.email}</a>.`
              : ` If nothing opened, email <a href="mailto:${LINKS.email}">${LINKS.email}</a> directly.`);
  });
  function bookSent(){
    form.outerHTML = `<div class="book book-done"><div class="page done-page" tabindex="-1" id="donepage">
        <p class="done-k">Signed &amp; Sent</p>
        <p class="done-h">Thanks for reaching out.</p>
        <p class="done-s">I will reply as soon as possible!</p>
      </div></div>`;
    status.textContent = "";
    wrap.querySelector(".book-btns").outerHTML = `<div class="book-btns one"><button type="button" class="btn" data-close><span class="lbl">Done</span></button></div>`;
    wrap.querySelector("[data-close]").focus();
  }
  setTimeout(()=>form.from.focus(), 30);
}
function closeBook(){
  const w = document.getElementById("book"); if(!w) return;
  w.remove(); document.documentElement.style.overflow=""; if(bookReturn && bookReturn.focus) bookReturn.focus();
}
document.addEventListener("click", e=>{ if(e.target.closest("[data-book]")){ e.preventDefault(); openBook(); } });
/* Resume: on the live site this opens resume.pdf in a new tab. When the page is opened
   straight from a downloaded file (file://), it shows the copy built into the page instead. */
let resumeURL=null;
function resumeBlobURL(){
  if(!resumeURL){
    const bin=atob(RESUME_B64), bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    resumeURL=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));
  }
  return resumeURL;
}

/* ============================================================ command bar */
const chat = document.getElementById("chat"), chatin = document.getElementById("chatin"),
      log = document.getElementById("log"), sugg = document.getElementById("sugg");
const CMDS = [
  {c:"/help", d:"Show every command"},
  {c:"/home", d:"Go to the title screen"},
  {c:"/projects", d:"Open Projects"},
  {c:"/bandit", d:"Open the Bandit writeups"},
  {c:"/bandit 5-6", d:"Open one Bandit level"},
  {c:"/experience", d:"Open Experience"},
  {c:"/certifications", d:"Open Certifications"},
  {c:"/about", d:"Open About Me"},
  {c:"/skills", d:"Open Skills"},
  {c:"/blog", d:"Open the Blog"},
  {c:"/contact", d:"Open Contact Me"},
  {c:"/whoami", d:"The one-line version"},
  {c:"/thm", d:"Open my TryHackMe profile"},
  {c:"/settings", d:"Open settings (volume, songs, motion)"},
  {c:"/time set night", d:"Switch the sky to night"},
  {c:"/time set day", d:"Switch the sky to day"},
  {c:"/clear", d:"Clear messages"}
];
function say(html, ttl=10000){
  const m = document.createElement("div"); m.className="msg"; m.innerHTML=html; log.appendChild(m);
  while(log.children.length>18) log.firstChild.remove();
  setTimeout(()=>m.classList.add("gone"), ttl);
  setTimeout(()=>m.remove(), ttl+700);
  m.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{ location.hash=b.dataset.go; }));
  m.querySelectorAll("[data-run]").forEach(b=>b.addEventListener("click",()=>{ log.innerHTML=""; runCmd(b.dataset.run); }));
}
function openChat(prefill="/"){
  chat.classList.add("open"); chatin.value=prefill; chatin.focus(); showSugg();
}
function closeChat(){ chat.classList.remove("open"); chatin.blur(); sugg.innerHTML=""; }
let selIdx=-1;
function showSugg(){
  const q=chatin.value.toLowerCase();
  const m = q.length>=1 ? CMDS.filter(x=>x.c.startsWith(q) && x.c!==q).slice(0,7) : [];
  selIdx=-1;
  sugg.innerHTML = m.map(x=>`<button data-c="${esc(x.c)}"><b>${esc(x.c)}</b>${esc(x.d)}</button>`).join("");
  sugg.querySelectorAll("button").forEach(b=>b.addEventListener("mousedown",e=>{ e.preventDefault(); chatin.value=b.dataset.c; showSugg(); chatin.focus(); }));
}
function go(h){ location.hash = h; }
function runCmd(raw){
  const line=raw.trim(); if(!line) return;
  const [verb,...rest]=line.replace(/^\//,"").split(/\s+/);
  const v=verb.toLowerCase(), arg=rest.join(" ").toLowerCase();
  say(`<span class="g">&gt;</span> ${esc(line)}`);
  const level = id => { for(const s of SERIES){ const l=s.levels.find(x=>x.id===id); if(l) return [s,l]; } return null; };
  switch(v){
    case "help": case "?":
      say(`<span class="y">Commands</span> <span class="g">(click one or type it)</span>`, 20000);
      CMDS.forEach(x=>say(`<button data-run="${esc(x.c)}">${esc(x.c)}</button> <span class="g">— ${esc(x.d)}</span>`, 20000)); return;
    case "home": case "menu": go("#/"); return;
    case "projects": go("#/projects"); return;
    case "writeups": case "ls": go(writeupsHref()); return;
    case "experience": case "jobs": go("#/experience"); return;
    case "achievements": case "certs": case "certifications": case "certificates": go("#/certifications"); return;
    case "about": go("#/about"); return;
    case "settings": case "options": openOpts(); return;
    case "skills": go("#/skills"); return;
    case "blog": go("#/blog"); return;
    case "contact": case "email": go("#/contact"); return;
    case "clear": log.innerHTML=""; return;
    case "thm": case "tryhackme": window.open(LINKS.tryhackme,"_blank","noopener"); return;
    case "whoami": say(`<span class="a">almer</span> — MIS student at SJSU, president of the Cyber Intelligence &amp; Security Club, open to security internships.`); return;
    case "sudo": say(`<span class="r">almer is not in the sudoers file. This incident will be reported.</span> <span class="g">(It won't.)</span>`); return;
    case "time":
      if(/night|midnight/.test(arg)){ World.setNight(true); say(`<span class="y">Set the time to night</span>`); return; }
      if(/day|noon/.test(arg)){ World.setNight(false); say(`<span class="y">Set the time to day</span>`); return; }
      say(`<span class="r">Usage: /time set day | night</span>`); return;
    case "bandit": case "cat": case "open": {
      let key = arg.replace(/\.md$/,"").replace(/^bandit[\s-]*/,"");
      if(v==="bandit" && !key){ go("#/w/bandit"); return; }
      if(key==="about"){ go("#/about"); return; }
      const hit = level(key);
      if(hit){ go(`#/w/${hit[0].slug}/${encodeURIComponent(hit[1].id)}`); return; }
      const p = PROJECTS.find(x=>x.slug===key); if(p){ go(`#/p/${p.slug}`); return; }
      const s = SERIES.find(x=>x.slug===key); if(s){ go(seriesHref(s)); return; }
      say(`<span class="r">Nothing called "${esc(arg)}".</span> <span class="g">Try</span> <button data-go="${writeupsHref()}">/bandit</button> <span class="g">or</span> <button data-go="#/projects">/projects</button>`); return;
    }
  }
  say(`<span class="r">Unknown command "${esc(verb)}".</span> <span class="g">Type</span> <span class="y">/help</span> <span class="g">for the list.</span>`);
}
chatin.addEventListener("input", showSugg);
chatin.addEventListener("keydown", e=>{
  const items=[...sugg.querySelectorAll("button")];
  if(e.key==="Enter"){ e.preventDefault();
    if(selIdx>-1 && items[selIdx]){ chatin.value=items[selIdx].dataset.c; showSugg(); return; }
    const v=chatin.value; closeChat(); runCmd(v); return; }
  if(e.key==="Escape"){ e.preventDefault(); closeChat(); return; }
  if(e.key==="Tab" && items.length){ e.preventDefault(); chatin.value=items[Math.max(selIdx,0)].dataset.c; showSugg(); return; }
  if((e.key==="ArrowDown"||e.key==="ArrowUp") && items.length){ e.preventDefault();
    selIdx = (selIdx + (e.key==="ArrowDown"?1:-1) + items.length) % items.length;
    items.forEach((b,i)=>b.classList.toggle("sel",i===selIdx)); }
});
chatin.addEventListener("blur", ()=> setTimeout(()=>{ if(document.activeElement!==chatin) closeChat(); }, 150));

document.addEventListener("keydown", e=>{
  if(chat.classList.contains("open")) return;
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="/"||e.key==="t"||e.key==="T"){ e.preventDefault(); openChat(e.key==="/"?"/":""); return; }
  if(e.key==="Escape" && parse().length){ e.preventDefault(); location.hash = parentOf(parse()); }
});

/* title-screen buttons are re-rendered, so delegate */
app.addEventListener("click", e=>{
  if(e.target.closest("#chatbtn")){ openChat("/"); return; }
  const sb = e.target.closest("#soundbtn");
  if(sb){ setSound(!soundOn); if(soundOn) click(); }
  if(e.target.closest("#optsbtn")) openOpts();
});

render();
</script>
